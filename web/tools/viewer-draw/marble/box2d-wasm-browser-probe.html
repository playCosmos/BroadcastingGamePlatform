<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Box2D WASM Browser Probe</title>
</head>
<body data-status="running">RUNNING
<script src="/admin/assets/viewer-draw-map-engine.js"></script>
<script src="/tools/viewer-draw/marble/browser-physics-adapter.js"></script>
<script>
(async () => {
  const Engine = window.ViewerDrawMapEngine;
  const Physics = window.ViewerDrawBrowserPhysics;

  try {
    const pinballResponse = await fetch(
      "/tools/viewer-draw/maps/retro-cadet-survivor-v3.json",
      { cache: "no-store" }
    );
    if (!pinballResponse.ok) {
      throw new Error(
        "completed pinball map missing: HTTP "
          + pinballResponse.status
      );
    }
    const pinballDefinition = await pinballResponse.json();

    const jumpResponse = await fetch(
      "/tools/viewer-draw/maps/magic-mirror-jump-v1.json",
      { cache: "no-store" }
    );
    if (!jumpResponse.ok) {
      throw new Error(
        "Magic Mirror Jump V1 missing: HTTP "
          + jumpResponse.status
      );
    }
    const jumpDefinition = await jumpResponse.json();

    const adapter = new Physics.Box2dWasmPhysicsAdapter();
    await adapter.init();

    // From this point the actual draw must not depend on any backend/network.
    const denyNetwork = () => {
      throw new Error("network access attempted after physics initialization");
    };
    window.fetch = denyNetwork;
    window.WebSocket = class {
      constructor() {
        denyNetwork();
      }
    };
    const OriginalXHR = window.XMLHttpRequest;
    if (OriginalXHR) {
      OriginalXHR.prototype.open = denyNetwork;
      OriginalXHR.prototype.send = denyNetwork;
    }

    const definition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Browser Box2D Probe",
      world: {
        width: 800,
        height: 600,
        gravityX: 0,
        gravityY: 12
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 400, 60),
          radius: 16,
          properties: { marbleRadius: 10 }
        },
        {
          ...Engine.componentDefaults("FINISH", 400, 530),
          width: 420,
          height: 90
        }
      ]
    };

    const entries = Array.from({ length: 6 }, (_, index) => ({
      entryId: "e" + (index + 1),
      displayName: "Entry " + (index + 1)
    }));

    adapter.loadMap(definition);
    let state = adapter.reset(entries, 42, { launchMode: "BUNCH" });
    if (!adapter.shakeMarble("m1")) {
      throw new Error("box2d stuck-recovery nudge failed");
    }

    for (
      let step = 0;
      step < 3600 && state.finishedCount < entries.length;
      step += 1
    ) {
      state = adapter.step(1 / 120);
    }

    if (adapter.engineId() !== "BOX2D_WASM_7_0_0") {
      throw new Error("unexpected engine id: " + adapter.engineId());
    }
    if (state.finishedCount !== entries.length) {
      throw new Error(
        "not all marbles finished: "
          + state.finishedCount + "/" + entries.length
      );
    }
    if (state.rankedEntries.length !== entries.length) {
      throw new Error("ranked entries mismatch");
    }

    const forceRotation = Engine.createPreset(
      "ROTATOR",
      330,
      220
    );
    forceRotation.id = "force-rotation";
    const oscillatingRotation = Engine.createPreset(
      "PENDULUM",
      540,
      220
    );
    oscillatingRotation.id = "oscillating-rotation";
    const freeRotation = Engine.createPreset(
      "HINGE",
      360,
      430
    );
    freeRotation.id = "free-rotation";
    const torqueRotation = Engine.createPreset(
      "PADDLE",
      690,
      430
    );
    torqueRotation.id = "torque-rotation";
    const elevator = Engine.componentDefaults(
      "ELEVATOR",
      1060,
      430
    );
    elevator.id = "probe-elevator";

    const goldbergDefinition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Goldberg Box2D Probe",
      world: {
        width: 1280,
        height: 720,
        gravityX: 0,
        gravityY: 12
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 640, 60),
          radius: 16,
          properties: { marbleRadius: 10 }
        },
        Engine.componentDefaults("WALL", 120, 220),
        Engine.componentDefaults("CURVE_WALL", 180, 320),
        Engine.componentDefaults("CIRCLE", 250, 430),
        forceRotation,
        oscillatingRotation,
        freeRotation,
        torqueRotation,
        Engine.componentDefaults("CONVEYOR", 880, 430),
        elevator,
        {
          ...Engine.componentDefaults("FINISH", 640, 660),
          width: 420,
          height: 70
        }
      ]
    };

    const goldbergErrors = Engine.validateDefinition(
      goldbergDefinition
    );
    if (goldbergErrors.length) {
      throw new Error(
        "Goldberg Box2D map validation failed: "
          + goldbergErrors.join(" / ")
      );
    }

    adapter.loadMap(goldbergDefinition);
    state = adapter.reset(entries.slice(0, 2), 77);
    for (let step = 0; step < 360; step += 1) {
      state = adapter.step(1 / 120);
    }
    if (!state || state.totalCount !== 2) {
      throw new Error("Goldberg Box2D map failed to step");
    }
    if (
      !Array.isArray(state.components)
      || !state.components.some(
        (component) => component.id === "free-rotation"
      )
      || !state.components.some(
        (component) => component.id === "torque-rotation"
      )
      || !state.components.some(
        (component) => component.id === "probe-elevator"
      )
    ) {
      throw new Error(
        "reactive rotation/elevator runtime state missing"
      );
    }
    if (adapter.movingComponents.length !== 2) {
      throw new Error(
        "force-driven rotation bodies were not created"
      );
    }
    if (adapter.reactiveComponents.length !== 3) {
      throw new Error(
        "physical rotation/elevator bodies were not created"
      );
    }
    if (adapter.elevators.length !== 1) {
      throw new Error(
        "elevator prismatic joint was not created"
      );
    }
    if (!Array.isArray(state.audioEvents)) {
      throw new Error("physics audio event channel missing");
    }
    const freeState = state.components.find(
      (component) => component.id === "free-rotation"
    );
    if (!freeState || !Number.isFinite(freeState.runtimeRotation)) {
      throw new Error("free rotation runtime angle missing");
    }

    const outputDefinition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Ordered Output Box2D Probe",
      world: {
        width: 800,
        height: 600,
        gravityX: 0,
        gravityY: 12
      },
      drawRule: {
        type: "ORDERED_OUTPUT",
        winnerCount: 1
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 400, 60),
          properties: { marbleRadius: 10 }
        },
        {
          ...Engine.componentDefaults("OUTPUT", 400, 530),
          width: 460,
          height: 100,
          properties: {
            outputKey: "WIN",
            outputRank: 1
          }
        }
      ]
    };
    adapter.loadMap(outputDefinition);
    state = adapter.reset(entries.slice(0, 3), 91);
    for (
      let step = 0;
      step < 3600 && state.finishedCount < 1;
      step += 1
    ) {
      state = adapter.step(1 / 120);
    }
    if (
      state.finishedCount !== 1
      || state.rankedEntries.length !== 1
    ) {
      throw new Error("ordered output did not select one winner");
    }

    const runSensorRule = (
      name,
      drawRule,
      sensorComponents,
      entryCount,
      expectedWinners,
      seed
    ) => {
      const sensorDefinition = {
        schemaVersion: Engine.SCHEMA_VERSION,
        name,
        world: {
          width: 800,
          height: 600,
          gravityX: 0,
          gravityY: 12
        },
        drawRule,
        components: [
          {
            ...Engine.componentDefaults("SPAWN", 400, 60),
            properties: { marbleRadius: 10 }
          },
          ...sensorComponents
        ]
      };
      const errors = Engine.validateDefinition(sensorDefinition);
      if (errors.length) {
        throw new Error(name + " validation failed: " + errors.join(" / "));
      }
      adapter.loadMap(sensorDefinition);
      let sensorState = adapter.reset(
        entries.slice(0, entryCount),
        seed
      );
      for (
        let step = 0;
        step < 3600
          && sensorState.rankedEntries.length < expectedWinners;
        step += 1
      ) {
        sensorState = adapter.step(1 / 120);
      }
      if (sensorState.rankedEntries.length !== expectedWinners) {
        throw new Error(
          name + " winner mismatch: "
            + sensorState.rankedEntries.length
            + "/" + expectedWinners
        );
      }
      return sensorState;
    };

    const slot = Engine.componentDefaults("SLOT", 400, 530);
    slot.width = 460;
    slot.height = 100;
    slot.properties = {
      slotKey: "A",
      slotCapacity: 2,
      soundMaterial: "wood",
      instrument: "xylophone",
      audioNote: 64,
      audioGain: 1.2,
      audioPan: -0.2
    };
    state = runSensorRule(
      "Slot Collection Box2D Probe",
      { type: "SLOT_COLLECTION", winnerCount: 2 },
      [slot],
      3,
      2,
      101
    );
    if (
      state.slotClaims.length !== 1
      || state.slotClaims[0].ids.length !== 2
    ) {
      throw new Error("slot claims were not persisted in runtime state");
    }
    if (!state.audioEvents.some(
      (event) =>
        event.kind === "slot"
        && event.material === "wood"
        && event.instrument === "xylophone"
        && event.note === 64
    )) {
      throw new Error("slot audio profile did not reach audio event channel");
    }

    const elimination = Engine.componentDefaults(
      "ELIMINATION",
      400,
      520
    );
    elimination.width = 600;
    elimination.height = 130;
    elimination.properties = {
      eliminationKey: "PIT",
      soundMaterial: "stone",
      instrument: "drum",
      audioNote: 40,
      audioGain: 1,
      audioPan: 0
    };
    state = runSensorRule(
      "Last Survivor Box2D Probe",
      { type: "LAST_SURVIVOR", winnerCount: 1 },
      [elimination],
      4,
      1,
      111
    );
    if (state.eliminationOrder.length !== 3) {
      throw new Error(
        "last survivor must eliminate exactly three marbles"
      );
    }

    const cascadeOutput = Engine.componentDefaults(
      "OUTPUT",
      400,
      530
    );
    cascadeOutput.width = 460;
    cascadeOutput.height = 100;
    cascadeOutput.properties = {
      outputKey: "C",
      outputRank: 1,
      outputCapacity: 2,
      outputWeight: 1
    };
    state = runSensorRule(
      "Cascade Box2D Probe",
      { type: "CASCADE_SELECTION", winnerCount: 2 },
      [cascadeOutput],
      3,
      2,
      121
    );
    if (
      state.outputClaims.length !== 1
      || state.outputClaims[0].value.length !== 2
    ) {
      throw new Error("cascade output capacity was not enforced");
    }

    const bucketA = Engine.componentDefaults("OUTPUT", 400, 530);
    bucketA.width = 460;
    bucketA.height = 100;
    bucketA.properties = {
      outputKey: "A",
      outputRank: 1,
      outputCapacity: 1,
      outputWeight: 1
    };
    const bucketB = Engine.componentDefaults("OUTPUT", 400, 530);
    bucketB.width = 460;
    bucketB.height = 100;
    bucketB.properties = {
      outputKey: "B",
      outputRank: 1,
      outputCapacity: 1,
      outputWeight: 3
    };
    state = runSensorRule(
      "Random Bucket Box2D Probe",
      { type: "RANDOM_OUTPUT_BUCKET", winnerCount: 1 },
      [bucketA, bucketB],
      3,
      1,
      131
    );
    if (!["A", "B"].includes(state.selectedOutputKey)) {
      throw new Error("random output bucket was not seed-selected");
    }

    const conditionalA = Engine.componentDefaults(
      "OUTPUT",
      400,
      530
    );
    conditionalA.width = 460;
    conditionalA.height = 100;
    conditionalA.properties = {
      ...conditionalA.properties,
      outputKey: "A",
      outputRank: 1,
      outputCapacity: 1,
      outputPriority: 10,
      conditionType: "ALWAYS"
    };
    const conditionalB = Engine.componentDefaults(
      "OUTPUT",
      400,
      530
    );
    conditionalB.width = 460;
    conditionalB.height = 100;
    conditionalB.properties = {
      ...conditionalB.properties,
      outputKey: "B",
      outputRank: 2,
      outputCapacity: 1,
      outputPriority: 20,
      conditionType: "AFTER_OUTPUT_FULL",
      conditionOutputKey: "A",
      conditionClaims: 1
    };
    state = runSensorRule(
      "Conditional Output Box2D Probe",
      { type: "CONDITIONAL_OUTPUT", winnerCount: 2 },
      [conditionalA, conditionalB],
      3,
      2,
      141
    );
    const conditionalClaims = new Map(
      state.outputClaims.map((item) => [
        item.key,
        item.value
      ])
    );
    if (
      conditionalClaims.get("A")?.length !== 1
      || conditionalClaims.get("B")?.length !== 1
    ) {
      throw new Error(
        "conditional output did not unlock chained output"
      );
    }

    const timeoutDefinition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Timeout Box2D Probe",
      world: {
        width: 800,
        height: 600,
        gravityX: 0,
        gravityY: 0
      },
      drawRule: {
        type: "RACE_FINISH",
        winnerCount: 1
      },
      runPolicy: {
        timeoutSeconds: 0.1,
        qualificationMinWinners: 1,
        qualificationMaxNudges: 0
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 100, 100),
          properties: { marbleRadius: 10 }
        },
        {
          ...Engine.componentDefaults("FINISH", 700, 530),
          width: 60,
          height: 40
        }
      ]
    };
    adapter.loadMap(timeoutDefinition);
    state = adapter.reset(entries.slice(0, 3), 151);
    for (
      let step = 0;
      step < 240 && !state.timedOut;
      step += 1
    ) {
      state = adapter.step(1 / 120);
    }
    if (
      !state.timedOut
      || state.runStatus !== "TIMEOUT"
      || state.dnfOrder.length !== 3
      || state.rankedEntries.length !== 0
    ) {
      throw new Error("Box2D timeout/DNF contract failed");
    }

    const pinballErrors = Engine.validateDefinition(
      pinballDefinition
    );
    if (pinballErrors.length) {
      throw new Error(
        "completed pinball map validation failed: "
          + pinballErrors.join(" / ")
      );
    }
    if (pinballDefinition.components.length !== 69) {
      throw new Error(
        "completed pinball map component count changed: "
          + pinballDefinition.components.length
      );
    }

    const launcher = pinballDefinition.components.find(
      (component) =>
        component.id ===
        "0974d44a-a029-4667-bde8-b864f9e7e674"
    );
    const oneWayHinge = pinballDefinition.components.find(
      (component) =>
        component.id ===
        "fadc5886-bcd8-41fb-a515-1fd9fa642c2b"
    );
    const cabinetArc = pinballDefinition.components.find(
      (component) =>
        component.id ===
        "d3c7a90b-30ff-4a2a-ae48-54dc35a90c91"
    );
    if (
      launcher?.x !== 1295
      || launcher?.y !== 2480
      || launcher?.properties?.burstPower !== 21
      || launcher?.properties?.burstIntervalMs !== 150
      || pinballDefinition.world?.width !== 1440
      || pinballDefinition.world?.height !== 2560
      || oneWayHinge?.properties?.rotationMode !== "FREE"
      || oneWayHinge?.properties?.pivotRatio !== -0.48
      || oneWayHinge?.properties?.startAngle !== 0
      || oneWayHinge?.properties?.endAngle !== 80
      || cabinetArc?.properties?.curveMode !== "CIRCULAR_ARC"
    ) {
      throw new Error(
        "uploaded launcher/one-way hinge/cabinet geometry was modified"
      );
    }

    adapter.loadMap(pinballDefinition);
    state = adapter.reset(
      entries.slice(0, 2),
      1,
      {
        launchMode: "BURST",
        launchIntervalMs: 90,
        winnerCount: 1
      }
    );

    let reachedUpperLane = false;
    let enteredPlayfield = false;
    for (let step = 0; step < 2400; step += 1) {
      state = adapter.step(1 / 120);
      for (const marble of state.marbles) {
        if (!marble.launched) continue;
        if (
          marble.y < 1000
          && marble.x > 1145
        ) {
          reachedUpperLane = true;
        }
        if (
          marble.y < 950
          && marble.x < 1140
        ) {
          enteredPlayfield = true;
        }
      }
      if (reachedUpperLane && enteredPlayfield) break;
    }
    if (!reachedUpperLane) {
      throw new Error(
        "pinball launcher did not carry a marble up the shooter lane"
      );
    }
    if (!enteredPlayfield) {
      throw new Error(
        "one-way hinge did not allow launcher-to-playfield entry"
      );
    }

    const oneWayWall = Engine.createPreset(
      "ONE_WAY_WALL",
      400,
      300
    );
    oneWayWall.width = 360;
    oneWayWall.height = 18;
    const oneWayDefinition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "One-Way Wall Box2D Probe",
      world: {
        width: 800,
        height: 600,
        gravityX: 0,
        gravityY: 0
      },
      drawRule: {
        type: "RACE_FINISH",
        winnerCount: 0
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 400, 120),
          properties: { marbleRadius: 10 }
        },
        oneWayWall,
        {
          ...Engine.componentDefaults("FINISH", 760, 560),
          width: 40,
          height: 40
        }
      ]
    };
    if (Engine.validateDefinition(oneWayDefinition).length) {
      throw new Error("one-way wall Box2D map failed validation");
    }

    adapter.loadMap(oneWayDefinition);
    state = adapter.reset(entries.slice(0, 1), 201, {
      launchMode: "BUNCH"
    });
    let body = adapter.marbles[0].body;
    body.SetTransform(
      new adapter.Box2D.b2Vec2(4, 2.4),
      0
    );
    body.SetLinearVelocity(
      new adapter.Box2D.b2Vec2(0, 12)
    );
    for (let step = 0; step < 16; step += 1) {
      state = adapter.step(1 / 120);
    }
    let oneWayMarble = state.marbles[0];
    if (!(oneWayMarble.y > 330)) {
      throw new Error(
        "one-way wall did not allow arrow-direction travel"
      );
    }

    adapter.loadMap(oneWayDefinition);
    state = adapter.reset(entries.slice(0, 1), 202, {
      launchMode: "BUNCH"
    });
    body = adapter.marbles[0].body;
    body.SetTransform(
      new adapter.Box2D.b2Vec2(4, 3.6),
      0
    );
    body.SetLinearVelocity(
      new adapter.Box2D.b2Vec2(0, -12)
    );
    for (let step = 0; step < 10; step += 1) {
      state = adapter.step(1 / 120);
    }
    oneWayMarble = state.marbles[0];
    const reverseVelocity =
      adapter.marbles[0].body.GetLinearVelocity();
    if (
      oneWayMarble.y < 318
      || reverseVelocity.y <= 0
    ) {
      throw new Error(
        "one-way wall did not block reverse travel"
      );
    }

    const boostedOneWayWall = structuredClone(oneWayWall);
    boostedOneWayWall.id = "boosted-one-way-wall-probe";
    boostedOneWayWall.properties.oneWayDirection = -1;
    boostedOneWayWall.properties.restitution = 0;
    boostedOneWayWall.properties.boost = 4;
    const boostedOneWayDefinition = {
      ...oneWayDefinition,
      name: "Boosted One-Way Wall Box2D Probe",
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 400, 240),
          properties: { marbleRadius: 10 }
        },
        boostedOneWayWall,
        {
          ...Engine.componentDefaults("FINISH", 760, 40),
          width: 40,
          height: 40
        }
      ]
    };
    adapter.loadMap(boostedOneWayDefinition);
    state = adapter.reset(entries.slice(0, 1), 205, {
      launchMode: "BUNCH"
    });
    body = adapter.marbles[0].body;
    body.SetTransform(
      new adapter.Box2D.b2Vec2(4, 2.4),
      0
    );
    body.SetLinearVelocity(
      new adapter.Box2D.b2Vec2(0, 2)
    );
    let boostedOneWayBestY = 240;
    for (let step = 0; step < 120; step += 1) {
      state = adapter.step(1 / 120);
      boostedOneWayBestY = Math.min(
        boostedOneWayBestY,
        state.marbles[0].y
      );
    }
    const boostedOneWayVelocity =
      adapter.marbles[0].body.GetLinearVelocity();
    if (boostedOneWayBestY > 210) {
      throw new Error(
        "static one-way boost did not launch from blocking side; bestY="
          + boostedOneWayBestY.toFixed(1)
          + ", vy="
          + boostedOneWayVelocity.y.toFixed(3)
          + ", blockers="
          + adapter.oneWayBlockingContacts.size
      );
    }

    const movingMirror = Engine.componentDefaults(
      "ROTATIONAL_BODY",
      400,
      300
    );
    movingMirror.width = 360;
    movingMirror.height = 18;
    movingMirror.properties.collisionMode = "ONE_WAY";
    movingMirror.properties.oneWayDirection = -1;
    movingMirror.properties.rotationMode = "FORCE_OSCILLATE";
    movingMirror.properties.startAngle = -4;
    movingMirror.properties.endAngle = 4;
    movingMirror.properties.period = 4;
    movingMirror.properties.restitution = 1.05;
    movingMirror.properties.boost = 4;

    const movingMirrorDefinition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Moving One-Way Mirror Box2D Probe",
      world: {
        width: 800,
        height: 600,
        gravityX: 0,
        gravityY: 0
      },
      drawRule: {
        type: "RACE_FINISH",
        winnerCount: 0
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 400, 380),
          properties: { marbleRadius: 10 }
        },
        movingMirror,
        {
          ...Engine.componentDefaults("FINISH", 760, 40),
          width: 40,
          height: 40
        }
      ]
    };
    if (Engine.validateDefinition(movingMirrorDefinition).length) {
      throw new Error(
        "moving one-way mirror Box2D map failed validation"
      );
    }

    adapter.loadMap(movingMirrorDefinition);
    state = adapter.reset(entries.slice(0, 1), 203, {
      launchMode: "BUNCH"
    });
    body = adapter.marbles[0].body;
    body.SetTransform(
      new adapter.Box2D.b2Vec2(4, 3.6),
      0
    );
    body.SetLinearVelocity(
      new adapter.Box2D.b2Vec2(0, -12)
    );
    for (let step = 0; step < 18; step += 1) {
      state = adapter.step(1 / 120);
    }
    let movingMirrorMarble = state.marbles[0];
    if (!(movingMirrorMarble.y < 250)) {
      throw new Error(
        "moving one-way mirror did not pass upward travel"
      );
    }

    adapter.loadMap(movingMirrorDefinition);
    state = adapter.reset(entries.slice(0, 1), 204, {
      launchMode: "BUNCH"
    });
    body = adapter.marbles[0].body;
    body.SetTransform(
      new adapter.Box2D.b2Vec2(4, 2.4),
      0
    );
    body.SetLinearVelocity(
      new adapter.Box2D.b2Vec2(0, 12)
    );
    for (let step = 0; step < 12; step += 1) {
      state = adapter.step(1 / 120);
    }
    movingMirrorMarble = state.marbles[0];
    const movingMirrorVelocity =
      adapter.marbles[0].body.GetLinearVelocity();
    if (
      movingMirrorMarble.y > 290
      || movingMirrorVelocity.y >= 0
    ) {
      throw new Error(
        "moving one-way mirror did not block and rebound falling travel"
      );
    }

    const jumpErrors = Engine.validateDefinition(
      Engine.migrateDefinition(jumpDefinition)
    );
    if (jumpErrors.length) {
      throw new Error(
        "Magic Mirror Jump V1 validation failed: "
          + jumpErrors.join(" / ")
      );
    }
    if (
      jumpDefinition.world?.width !== 1440
      || jumpDefinition.world?.height !== 5000
      || jumpDefinition.drawRule?.type !== "RACE_FINISH"
      || jumpDefinition.components.length !== 53
    ) {
      throw new Error(
        "Magic Mirror Jump V1 structural contract changed"
      );
    }

    const progressionMirrors = jumpDefinition.components.filter(
      (component) =>
        ["WALL", "ELEVATOR", "ROTATIONAL_BODY"].includes(component.type)
        && component.properties?.collisionMode === "ONE_WAY"
        && Number(component.properties?.oneWayDirection) === -1
    );
    const progressionLevels = [
      ...new Set(progressionMirrors.map(
        (component) => Number(component.y)
      ))
    ].sort((a, b) => b - a);
    const actualGaps = progressionLevels
      .slice(0, -1)
      .map((y, index) => y - progressionLevels[index + 1]);
    if (
      progressionLevels.length !== 16
      || actualGaps.length !== 15
      || actualGaps.some(
        (gap, index) => gap !== 210 + index * 10
      )
    ) {
      throw new Error(
        "Magic Mirror Jump V1 progression changed"
      );
    }

    const movingMirrors = progressionMirrors.filter(
      (component) =>
        component.type === "ROTATIONAL_BODY"
        && component.properties?.rotationMode === "FORCE_OSCILLATE"
    );
    if (
      movingMirrors.length !== 6
      || movingMirrors.some(
        (component) =>
          Math.abs(
            Number(component.properties?.endAngle)
            - Number(component.properties?.startAngle)
          ) > 10
      )
    ) {
      throw new Error(
        "Magic Mirror Jump V1 moving mirror contract changed"
      );
    }

    const jumpEntries = Array.from(
      { length: 12 },
      (_, index) => ({
        entryId: "jump-" + (index + 1),
        displayName: "Jump " + (index + 1)
      })
    );
    adapter.loadMap(jumpDefinition);
    state = adapter.reset(jumpEntries, 31, {
      launchMode: "BUNCH",
      winnerCount: 1
    });

    let bestJumpY = 5000;
    let jumpBoostEvents = 0;
    let jumpImpactEvents = 0;
    const jumpBoostIds = new Set();
    const jumpImpactIds = new Set();
    for (
      let step = 0;
      step < 7200 && state.finishedCount < 1;
      step += 1
    ) {
      state = adapter.step(1 / 60);
      for (const marble of state.marbles) {
        if (marble.launched !== false) {
          bestJumpY = Math.min(bestJumpY, marble.y);
        }
      }
      for (const event of state.audioEvents || []) {
        if (event.kind === "boost") {
          jumpBoostEvents += 1;
          jumpBoostIds.add(event.componentId || "");
        } else if (event.kind === "impact") {
          jumpImpactEvents += 1;
          jumpImpactIds.add(event.componentId || "");
        }
      }
    }
    if (state.finishedCount < 1) {
      throw new Error(
        "Magic Mirror Jump V1 did not produce a finisher; bestY="
          + bestJumpY.toFixed(1)
          + ", boosts="
          + jumpBoostEvents
          + "["
          + [...jumpBoostIds].slice(0, 12).join(",")
          + "]"
          + ", impacts="
          + jumpImpactEvents
          + "["
          + [...jumpImpactIds].slice(0, 12).join(",")
          + "]"
      );
    }

    document.body.dataset.status = "pass";
    document.body.textContent = "PASS";
  } catch (error) {
    console.error(error);
    document.body.dataset.status = "fail";
    document.body.textContent =
      "FAIL: " + (error?.stack || error?.message || String(error));
  }
})();
</script>
</body>
</html>
