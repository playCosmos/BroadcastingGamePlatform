<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Box2D WASM Browser Probe</title>
</head>
<body data-status="running">RUNNING
<script src="/admin/assets/viewer-draw-map-engine.js"></script>
<script src="/tools/viewer-draw/marble/browser-physics-adapter.js"></script>
<script>
(async () => {
  const Engine = window.ViewerDrawMapEngine;
  const Physics = window.ViewerDrawBrowserPhysics;

  try {
    const adapter = new Physics.Box2dWasmPhysicsAdapter();
    await adapter.init();

    // From this point the actual draw must not depend on any backend/network.
    const denyNetwork = () => {
      throw new Error("network access attempted after physics initialization");
    };
    window.fetch = denyNetwork;
    window.WebSocket = class {
      constructor() {
        denyNetwork();
      }
    };
    const OriginalXHR = window.XMLHttpRequest;
    if (OriginalXHR) {
      OriginalXHR.prototype.open = denyNetwork;
      OriginalXHR.prototype.send = denyNetwork;
    }

    const definition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Browser Box2D Probe",
      world: {
        width: 800,
        height: 600,
        gravityX: 0,
        gravityY: 12
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 400, 60),
          radius: 16,
          properties: { marbleRadius: 10 }
        },
        {
          ...Engine.componentDefaults("FINISH", 400, 530),
          width: 420,
          height: 90
        }
      ]
    };

    const entries = Array.from({ length: 6 }, (_, index) => ({
      entryId: "e" + (index + 1),
      displayName: "Entry " + (index + 1)
    }));

    adapter.loadMap(definition);
    let state = adapter.reset(entries, 42);
    if (!adapter.shakeMarble("m1")) {
      throw new Error("box2d stuck-recovery nudge failed");
    }

    for (
      let step = 0;
      step < 3600 && state.finishedCount < entries.length;
      step += 1
    ) {
      state = adapter.step(1 / 120);
    }

    if (adapter.engineId() !== "BOX2D_WASM_7_0_0") {
      throw new Error("unexpected engine id: " + adapter.engineId());
    }
    if (state.finishedCount !== entries.length) {
      throw new Error(
        "not all marbles finished: "
          + state.finishedCount + "/" + entries.length
      );
    }
    if (state.rankedEntries.length !== entries.length) {
      throw new Error("ranked entries mismatch");
    }

    const gearA = Engine.componentDefaults("GEAR", 360, 430);
    gearA.id = "gear-a";
    const gearB = Engine.componentDefaults("GEAR", 520, 430);
    gearB.id = "gear-b";
    gearA.properties = {
      ...gearA.properties,
      linkedComponentId: gearB.id,
      gearRatio: -1
    };

    const goldbergDefinition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Goldberg Box2D Probe",
      world: {
        width: 1280,
        height: 720,
        gravityX: 0,
        gravityY: 12
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 640, 60),
          radius: 16,
          properties: { marbleRadius: 10 }
        },
        Engine.componentDefaults("GATE", 120, 220),
        Engine.componentDefaults("ROTATOR", 330, 220),
        Engine.componentDefaults("PENDULUM", 540, 220),
        Engine.componentDefaults("SEESAW", 750, 220),
        Engine.componentDefaults("FUNNEL", 960, 270),
        Engine.componentDefaults("SPLITTER", 1120, 270),
        Engine.componentDefaults("HINGE", 180, 430),
        gearA,
        gearB,
        Engine.componentDefaults("PADDLE", 690, 430),
        Engine.componentDefaults("LAUNCHER", 880, 430),
        Engine.componentDefaults("ELEVATOR", 1060, 430),
        {
          ...Engine.componentDefaults("FINISH", 640, 660),
          width: 420,
          height: 70
        }
      ]
    };

    adapter.loadMap(goldbergDefinition);
    state = adapter.reset(entries.slice(0, 2), 77);
    for (let step = 0; step < 360; step += 1) {
      state = adapter.step(1 / 120);
    }
    if (!state || state.totalCount !== 2) {
      throw new Error("Goldberg Box2D map failed to step");
    }
    if (!Array.isArray(state.components) || state.components.length !== 5) {
      throw new Error("reactive component runtime state missing");
    }
    if (adapter.gearCouplings.length !== 1) {
      throw new Error("gear coupling was not created");
    }
    if (adapter.elevators.length !== 1) {
      throw new Error("elevator prismatic joint was not created");
    }
    if (!Array.isArray(state.audioEvents)) {
      throw new Error("physics audio event channel missing");
    }
    const gearState = state.components.find(
      (component) => component.type === "GEAR"
    );
    if (!gearState || !Number.isFinite(gearState.runtimeRotation)) {
      throw new Error("gear runtime rotation missing");
    }

    const outputDefinition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Ordered Output Box2D Probe",
      world: {
        width: 800,
        height: 600,
        gravityX: 0,
        gravityY: 12
      },
      drawRule: {
        type: "ORDERED_OUTPUT",
        winnerCount: 1
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 400, 60),
          properties: { marbleRadius: 10 }
        },
        {
          ...Engine.componentDefaults("OUTPUT", 400, 530),
          width: 460,
          height: 100,
          properties: {
            outputKey: "WIN",
            outputRank: 1
          }
        }
      ]
    };
    adapter.loadMap(outputDefinition);
    state = adapter.reset(entries.slice(0, 3), 91);
    for (
      let step = 0;
      step < 3600 && state.finishedCount < 1;
      step += 1
    ) {
      state = adapter.step(1 / 120);
    }
    if (
      state.finishedCount !== 1
      || state.rankedEntries.length !== 1
    ) {
      throw new Error("ordered output did not select one winner");
    }

    const runSensorRule = (
      name,
      drawRule,
      sensorComponents,
      entryCount,
      expectedWinners,
      seed
    ) => {
      const sensorDefinition = {
        schemaVersion: Engine.SCHEMA_VERSION,
        name,
        world: {
          width: 800,
          height: 600,
          gravityX: 0,
          gravityY: 12
        },
        drawRule,
        components: [
          {
            ...Engine.componentDefaults("SPAWN", 400, 60),
            properties: { marbleRadius: 10 }
          },
          ...sensorComponents
        ]
      };
      const errors = Engine.validateDefinition(sensorDefinition);
      if (errors.length) {
        throw new Error(name + " validation failed: " + errors.join(" / "));
      }
      adapter.loadMap(sensorDefinition);
      let sensorState = adapter.reset(
        entries.slice(0, entryCount),
        seed
      );
      for (
        let step = 0;
        step < 3600
          && sensorState.rankedEntries.length < expectedWinners;
        step += 1
      ) {
        sensorState = adapter.step(1 / 120);
      }
      if (sensorState.rankedEntries.length !== expectedWinners) {
        throw new Error(
          name + " winner mismatch: "
            + sensorState.rankedEntries.length
            + "/" + expectedWinners
        );
      }
      return sensorState;
    };

    const slot = Engine.componentDefaults("SLOT", 400, 530);
    slot.width = 460;
    slot.height = 100;
    slot.properties = {
      slotKey: "A",
      slotCapacity: 2,
      soundMaterial: "wood",
      instrument: "xylophone",
      audioNote: 64,
      audioGain: 1.2,
      audioPan: -0.2
    };
    state = runSensorRule(
      "Slot Collection Box2D Probe",
      { type: "SLOT_COLLECTION", winnerCount: 2 },
      [slot],
      3,
      2,
      101
    );
    if (
      state.slotClaims.length !== 1
      || state.slotClaims[0].ids.length !== 2
    ) {
      throw new Error("slot claims were not persisted in runtime state");
    }
    if (!state.audioEvents.some(
      (event) =>
        event.kind === "slot"
        && event.material === "wood"
        && event.instrument === "xylophone"
        && event.note === 64
    )) {
      throw new Error("slot audio profile did not reach audio event channel");
    }

    const elimination = Engine.componentDefaults(
      "ELIMINATION",
      400,
      520
    );
    elimination.width = 600;
    elimination.height = 130;
    elimination.properties = {
      eliminationKey: "PIT",
      soundMaterial: "stone",
      instrument: "drum",
      audioNote: 40,
      audioGain: 1,
      audioPan: 0
    };
    state = runSensorRule(
      "Last Survivor Box2D Probe",
      { type: "LAST_SURVIVOR", winnerCount: 1 },
      [elimination],
      4,
      1,
      111
    );
    if (state.eliminationOrder.length !== 3) {
      throw new Error(
        "last survivor must eliminate exactly three marbles"
      );
    }

    const cascadeOutput = Engine.componentDefaults(
      "OUTPUT",
      400,
      530
    );
    cascadeOutput.width = 460;
    cascadeOutput.height = 100;
    cascadeOutput.properties = {
      outputKey: "C",
      outputRank: 1,
      outputCapacity: 2,
      outputWeight: 1
    };
    state = runSensorRule(
      "Cascade Box2D Probe",
      { type: "CASCADE_SELECTION", winnerCount: 2 },
      [cascadeOutput],
      3,
      2,
      121
    );
    if (
      state.outputClaims.length !== 1
      || state.outputClaims[0].value.length !== 2
    ) {
      throw new Error("cascade output capacity was not enforced");
    }

    const bucketA = Engine.componentDefaults("OUTPUT", 400, 530);
    bucketA.width = 460;
    bucketA.height = 100;
    bucketA.properties = {
      outputKey: "A",
      outputRank: 1,
      outputCapacity: 1,
      outputWeight: 1
    };
    const bucketB = Engine.componentDefaults("OUTPUT", 400, 530);
    bucketB.width = 460;
    bucketB.height = 100;
    bucketB.properties = {
      outputKey: "B",
      outputRank: 1,
      outputCapacity: 1,
      outputWeight: 3
    };
    state = runSensorRule(
      "Random Bucket Box2D Probe",
      { type: "RANDOM_OUTPUT_BUCKET", winnerCount: 1 },
      [bucketA, bucketB],
      3,
      1,
      131
    );
    if (!["A", "B"].includes(state.selectedOutputKey)) {
      throw new Error("random output bucket was not seed-selected");
    }

    const conditionalA = Engine.componentDefaults(
      "OUTPUT",
      400,
      530
    );
    conditionalA.width = 460;
    conditionalA.height = 100;
    conditionalA.properties = {
      ...conditionalA.properties,
      outputKey: "A",
      outputRank: 1,
      outputCapacity: 1,
      outputPriority: 10,
      conditionType: "ALWAYS"
    };
    const conditionalB = Engine.componentDefaults(
      "OUTPUT",
      400,
      530
    );
    conditionalB.width = 460;
    conditionalB.height = 100;
    conditionalB.properties = {
      ...conditionalB.properties,
      outputKey: "B",
      outputRank: 2,
      outputCapacity: 1,
      outputPriority: 20,
      conditionType: "AFTER_OUTPUT_FULL",
      conditionOutputKey: "A",
      conditionClaims: 1
    };
    state = runSensorRule(
      "Conditional Output Box2D Probe",
      { type: "CONDITIONAL_OUTPUT", winnerCount: 2 },
      [conditionalA, conditionalB],
      3,
      2,
      141
    );
    const conditionalClaims = new Map(
      state.outputClaims.map((item) => [
        item.key,
        item.value
      ])
    );
    if (
      conditionalClaims.get("A")?.length !== 1
      || conditionalClaims.get("B")?.length !== 1
    ) {
      throw new Error(
        "conditional output did not unlock chained output"
      );
    }

    const timeoutDefinition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Timeout Box2D Probe",
      world: {
        width: 800,
        height: 600,
        gravityX: 0,
        gravityY: 0
      },
      drawRule: {
        type: "RACE_FINISH",
        winnerCount: 1
      },
      runPolicy: {
        timeoutSeconds: 0.1,
        qualificationMinWinners: 1,
        qualificationMaxNudges: 0
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 100, 100),
          properties: { marbleRadius: 10 }
        },
        {
          ...Engine.componentDefaults("FINISH", 700, 530),
          width: 60,
          height: 40
        }
      ]
    };
    adapter.loadMap(timeoutDefinition);
    state = adapter.reset(entries.slice(0, 3), 151);
    for (
      let step = 0;
      step < 240 && !state.timedOut;
      step += 1
    ) {
      state = adapter.step(1 / 120);
    }
    if (
      !state.timedOut
      || state.runStatus !== "TIMEOUT"
      || state.dnfOrder.length !== 3
      || state.rankedEntries.length !== 0
    ) {
      throw new Error("Box2D timeout/DNF contract failed");
    }

    document.body.dataset.status = "pass";
    document.body.textContent = "PASS";
  } catch (error) {
    console.error(error);
    document.body.dataset.status = "fail";
    document.body.textContent =
      "FAIL: " + (error?.stack || error?.message || String(error));
  }
})();
</script>
</body>
</html>
