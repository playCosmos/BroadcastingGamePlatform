<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Box2D WASM Browser Probe</title>
</head>
<body data-status="running">RUNNING
<script src="/admin/assets/viewer-draw-map-engine.js"></script>
<script src="/tools/viewer-draw/marble/browser-physics-adapter.js"></script>
<script>
(async () => {
  const Engine = window.ViewerDrawMapEngine;
  const Physics = window.ViewerDrawBrowserPhysics;

  try {
    const adapter = new Physics.Box2dWasmPhysicsAdapter();
    await adapter.init();

    // From this point the actual draw must not depend on any backend/network.
    const denyNetwork = () => {
      throw new Error("network access attempted after physics initialization");
    };
    window.fetch = denyNetwork;
    window.WebSocket = class {
      constructor() {
        denyNetwork();
      }
    };
    const OriginalXHR = window.XMLHttpRequest;
    if (OriginalXHR) {
      OriginalXHR.prototype.open = denyNetwork;
      OriginalXHR.prototype.send = denyNetwork;
    }

    const definition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Browser Box2D Probe",
      world: {
        width: 800,
        height: 600,
        gravityX: 0,
        gravityY: 12
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 400, 60),
          radius: 16,
          properties: { marbleRadius: 10 }
        },
        {
          ...Engine.componentDefaults("FINISH", 400, 530),
          width: 420,
          height: 90
        }
      ]
    };

    const entries = Array.from({ length: 6 }, (_, index) => ({
      entryId: "e" + (index + 1),
      displayName: "Entry " + (index + 1)
    }));

    adapter.loadMap(definition);
    let state = adapter.reset(entries, 42);
    if (!adapter.shakeMarble("m1")) {
      throw new Error("box2d stuck-recovery nudge failed");
    }

    for (
      let step = 0;
      step < 3600 && state.finishedCount < entries.length;
      step += 1
    ) {
      state = adapter.step(1 / 120);
    }

    if (adapter.engineId() !== "BOX2D_WASM_7_0_0") {
      throw new Error("unexpected engine id: " + adapter.engineId());
    }
    if (state.finishedCount !== entries.length) {
      throw new Error(
        "not all marbles finished: "
          + state.finishedCount + "/" + entries.length
      );
    }
    if (state.rankedEntries.length !== entries.length) {
      throw new Error("ranked entries mismatch");
    }

    const gearA = Engine.componentDefaults("GEAR", 360, 430);
    gearA.id = "gear-a";
    const gearB = Engine.componentDefaults("GEAR", 520, 430);
    gearB.id = "gear-b";
    gearA.properties = {
      ...gearA.properties,
      linkedComponentId: gearB.id,
      gearRatio: -1
    };

    const goldbergDefinition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Goldberg Box2D Probe",
      world: {
        width: 1280,
        height: 720,
        gravityX: 0,
        gravityY: 12
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 640, 60),
          radius: 16,
          properties: { marbleRadius: 10 }
        },
        Engine.componentDefaults("GATE", 120, 220),
        Engine.componentDefaults("ROTATOR", 330, 220),
        Engine.componentDefaults("PENDULUM", 540, 220),
        Engine.componentDefaults("SEESAW", 750, 220),
        Engine.componentDefaults("FUNNEL", 960, 270),
        Engine.componentDefaults("SPLITTER", 1120, 270),
        Engine.componentDefaults("HINGE", 180, 430),
        gearA,
        gearB,
        Engine.componentDefaults("PADDLE", 690, 430),
        Engine.componentDefaults("LAUNCHER", 880, 430),
        Engine.componentDefaults("ELEVATOR", 1060, 430),
        {
          ...Engine.componentDefaults("FINISH", 640, 660),
          width: 420,
          height: 70
        }
      ]
    };

    adapter.loadMap(goldbergDefinition);
    state = adapter.reset(entries.slice(0, 2), 77);
    for (let step = 0; step < 360; step += 1) {
      state = adapter.step(1 / 120);
    }
    if (!state || state.totalCount !== 2) {
      throw new Error("Goldberg Box2D map failed to step");
    }
    if (!Array.isArray(state.components) || state.components.length !== 5) {
      throw new Error("reactive component runtime state missing");
    }
    if (adapter.gearCouplings.length !== 1) {
      throw new Error("gear coupling was not created");
    }
    if (adapter.elevators.length !== 1) {
      throw new Error("elevator prismatic joint was not created");
    }
    if (!Array.isArray(state.audioEvents)) {
      throw new Error("physics audio event channel missing");
    }
    const gearState = state.components.find(
      (component) => component.type === "GEAR"
    );
    if (!gearState || !Number.isFinite(gearState.runtimeRotation)) {
      throw new Error("gear runtime rotation missing");
    }

    const outputDefinition = {
      schemaVersion: Engine.SCHEMA_VERSION,
      name: "Ordered Output Box2D Probe",
      world: {
        width: 800,
        height: 600,
        gravityX: 0,
        gravityY: 12
      },
      drawRule: {
        type: "ORDERED_OUTPUT",
        winnerCount: 1
      },
      components: [
        {
          ...Engine.componentDefaults("SPAWN", 400, 60),
          properties: { marbleRadius: 10 }
        },
        {
          ...Engine.componentDefaults("OUTPUT", 400, 530),
          width: 460,
          height: 100,
          properties: {
            outputKey: "WIN",
            outputRank: 1
          }
        }
      ]
    };
    adapter.loadMap(outputDefinition);
    state = adapter.reset(entries.slice(0, 3), 91);
    for (
      let step = 0;
      step < 3600 && state.finishedCount < 1;
      step += 1
    ) {
      state = adapter.step(1 / 120);
    }
    if (
      state.finishedCount !== 1
      || state.rankedEntries.length !== 1
    ) {
      throw new Error("ordered output did not select one winner");
    }

    document.body.dataset.status = "pass";
    document.body.textContent = "PASS";
  } catch (error) {
    console.error(error);
    document.body.dataset.status = "fail";
    document.body.textContent =
      "FAIL: " + (error?.stack || error?.message || String(error));
  }
})();
</script>
</body>
</html>
