<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>시청자 추첨 · 마블 맵 메이커</title>
  <link rel="stylesheet" href="/assets/platform.css">
  <link rel="stylesheet" href="/admin/assets/viewer-draw-map-maker.css?v=20261001-pivot2">
</head>
<body>
<main class="shell map-maker-shell">
  <header class="hero compact map-maker-header">
    <div>
      <p class="eyebrow">시청자 추첨 / 마블 머신</p>
      <h1>맵 메이커</h1>
      <p class="lead">맵 편집과 물리 미리보기가 같은 JSON 정의를 사용합니다.</p>
    </div>
    <div class="hero-actions">
      <a class="secondary" href="/admin/tools/viewer-draw/">← 시청자 추첨</a>
      <a id="openMarbleDraw" class="secondary" href="/tools/viewer-draw/marble/">현재 맵으로 Browser Marble Draw →</a>
    </div>
  </header>

  <section class="map-topbar">
    <label><span>맵 이름</span><input id="mapName" value="New Marble Machine"></label>
    <label><span>저장된 맵</span><select id="savedMaps"><option value="">새 맵</option></select></label>
    <button id="loadMap" class="small-button">불러오기</button>
    <button id="newMap" class="small-button">새 맵</button>
    <button id="saveMap" class="primary-button">저장</button>
    <button id="archiveMap" class="small-button danger">보관</button>
    <button id="validateMap" class="small-button">검증</button>
    <button id="exportMap" class="small-button">JSON 내보내기</button>
    <button id="importMap" class="small-button">JSON 불러오기</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </section>

  <section class="map-maker-grid">
    <aside class="maker-panel palette-panel">
      <p class="panel-title">도구</p>
      <button class="palette-item active" data-tool="SELECT" data-tooltip="오브젝트를 선택하고 이동·회전·크기를 편집합니다.">선택</button>

      <div class="palette-group" data-palette-group="linear">
        <button class="palette-group-trigger" type="button" aria-expanded="false">
          <span>직선 구조체</span><span class="palette-group-chevron" aria-hidden="true">›</span>
        </button>
        <div class="palette-flyout" role="menu">
          <p class="palette-flyout-title">WALL 프리셋</p>
          <button class="palette-item palette-preset" data-tool="WALL" role="menuitem" data-tooltip="기본 직선 충돌체입니다. Boost 기본값은 0입니다.">
            <span>일반 벽</span><small>기본</small>
          </button>
          <button class="palette-item palette-preset" data-tool="PRESET_LAUNCH_WALL" role="menuitem" data-tooltip="일반 벽과 같은 WALL이며 Boost 기본값만 높습니다.">
            <span>발사벽</span><small>Boost 프리셋</small>
          </button>
        </div>
      </div>

      <div class="palette-group" data-palette-group="curve">
        <button class="palette-group-trigger" type="button" aria-expanded="false">
          <span>곡선 구조체</span><span class="palette-group-chevron" aria-hidden="true">›</span>
        </button>
        <div class="palette-flyout" role="menu">
          <p class="palette-flyout-title">CURVE WALL</p>
          <button class="palette-item palette-preset" data-tool="CURVE_WALL" role="menuitem" data-tooltip="폭과 높이로 곡률을 조절하는 곡선 충돌체입니다.">
            <span>곡선 벽</span><small>기본</small>
          </button>
        </div>
      </div>

      <div class="palette-group" data-palette-group="circle">
        <button class="palette-group-trigger" type="button" aria-expanded="false">
          <span>원형 구조체</span><span class="palette-group-chevron" aria-hidden="true">›</span>
        </button>
        <div class="palette-flyout" role="menu">
          <p class="palette-flyout-title">CIRCLE 프리셋</p>
          <button class="palette-item palette-preset" data-tool="PRESET_PEG" role="menuitem" data-tooltip="CIRCLE 기반 작은 충돌체입니다. Boost 기본값은 0입니다.">
            <span>핀</span><small>기본</small>
          </button>
          <button class="palette-item palette-preset" data-tool="PRESET_BUMPER" role="menuitem" data-tooltip="핀과 같은 CIRCLE이며 높은 탄성과 Boost 기본값을 사용합니다.">
            <span>범퍼</span><small>Boost 프리셋</small>
          </button>
        </div>
      </div>

      <div class="palette-group" data-palette-group="kinematic-rotation">
        <button class="palette-group-trigger" type="button" aria-expanded="false">
          <span>구동 회전 구조체</span><span class="palette-group-chevron" aria-hidden="true">›</span>
        </button>
        <div class="palette-flyout palette-flyout-wide" role="menu">
          <p class="palette-flyout-title">KINEMATIC ROTATION 프리셋</p>
          <button class="palette-item palette-preset" data-tool="ROTATOR" role="menuitem" data-tooltip="중심축을 기준으로 일정 속도로 계속 회전합니다. 판 개수를 1~4개로 설정할 수 있습니다."><span>회전판</span><small>연속 회전</small></button>
          <button class="palette-item palette-preset" data-tool="GATE" role="menuitem" data-tooltip="지정된 각도 범위를 주기적으로 왕복하여 통로를 열고 닫습니다."><span>게이트</span><small>왕복 회전</small></button>
          <button class="palette-item palette-preset" data-tool="PENDULUM" role="menuitem" data-tooltip="기준축에서 좌우로 왕복 회전하며 구슬과 충돌하는 진자 프리셋입니다."><span>진자</span><small>왕복 회전</small></button>
          <button class="palette-item palette-preset" data-tool="SEESAW" role="menuitem" data-tooltip="중앙을 기준으로 작은 각도를 왕복하는 시소 프리셋입니다."><span>시소</span><small>왕복 회전</small></button>
        </div>
      </div>

      <div class="palette-group" data-palette-group="revolute-rotation">
        <button class="palette-group-trigger" type="button" aria-expanded="false">
          <span>물리 관절 구조체</span><span class="palette-group-chevron" aria-hidden="true">›</span>
        </button>
        <div class="palette-flyout palette-flyout-wide" role="menu">
          <p class="palette-flyout-title">REVOLUTE JOINT 프리셋</p>
          <button class="palette-item palette-preset" data-tool="HINGE" role="menuitem" data-tooltip="실제 회전 관절입니다. 구슬의 충돌 힘을 받아 회전하며 각도 범위와 관절 마찰을 설정합니다."><span>힌지 / 피벗</span><small>자유 관절</small></button>
          <button class="palette-item palette-preset" data-tool="PADDLE" role="menuitem" data-tooltip="한쪽 회전축에 모터를 적용한 관절형 패들입니다."><span>패들</span><small>모터 관절</small></button>
        </div>
      </div>

      <div class="palette-group" data-palette-group="transport">
        <button class="palette-group-trigger" type="button" aria-expanded="false">
          <span>이송 장치</span><span class="palette-group-chevron" aria-hidden="true">›</span>
        </button>
        <div class="palette-flyout" role="menu">
          <p class="palette-flyout-title">서로 다른 동작</p>
          <button class="palette-item" data-tool="CONVEYOR" role="menuitem" data-tooltip="고정된 벨트 표면이 접촉한 구슬에 설정한 방향의 속도를 전달합니다.">컨베이어</button>
          <button class="palette-item" data-tool="ELEVATOR" role="menuitem" data-tooltip="플랫폼 자체가 설정한 축을 따라 왕복 이동합니다.">엘리베이터</button>
        </div>
      </div>

      <div class="palette-group" data-palette-group="spawn">
        <button class="palette-group-trigger" type="button" aria-expanded="false">
          <span>생성 장치</span><span class="palette-group-chevron" aria-hidden="true">›</span>
        </button>
        <div class="palette-flyout" role="menu">
          <button class="palette-item" data-tool="SPAWN" role="menuitem" data-tooltip="구슬을 한 위치 주변에 생성하는 기본 스포너입니다.">뭉침 스포너</button>
          <button class="palette-item" data-tool="BURST_SPAWN" role="menuitem" data-tooltip="구슬을 묶음 단위로 생성하고 지정 방향으로 발사하는 스포너입니다.">버스트 스포너</button>
        </div>
      </div>

      <div class="palette-group" data-palette-group="result">
        <button class="palette-group-trigger" type="button" aria-expanded="false">
          <span>판정·출력</span><span class="palette-group-chevron" aria-hidden="true">›</span>
        </button>
        <div class="palette-flyout" role="menu">
          <button class="palette-item" data-tool="FINISH" role="menuitem" data-tooltip="구슬이 들어오면 레이스 도착으로 판정하는 센서 영역입니다.">도착 지점</button>
          <button class="palette-item" data-tool="OUTPUT" role="menuitem" data-tooltip="조건과 순위에 따라 구슬을 결과 출력으로 확정하는 센서 영역입니다.">출력 구역</button>
          <button class="palette-item" data-tool="SLOT" role="menuitem" data-tooltip="설정한 용량만큼 구슬을 수집하는 슬롯 영역입니다.">슬롯</button>
          <button class="palette-item" data-tool="ELIMINATION" role="menuitem" data-tooltip="들어온 구슬을 탈락 처리하는 센서 영역입니다.">탈락 구역</button>
        </div>
      </div>

      <div class="panel-section">
        <p class="panel-title">편집</p>
        <div class="button-pair">
          <button id="undo" class="small-button">실행 취소</button>
          <button id="redo" class="small-button">다시 실행</button>
        </div>
        <div class="button-pair">
          <button id="duplicate" class="small-button">복제</button>
          <button id="deleteSelected" class="small-button danger">삭제</button>
        </div>
      </div>

      <div class="panel-section">
        <p class="panel-title">월드</p>
        <label class="mini-field"><span>너비</span><input id="worldWidth" type="number" value="1280" min="0"></label>
        <label class="mini-field"><span>높이</span><input id="worldHeight" type="number" value="720" min="0"></label>
        <label class="mini-field"><span>X 중력</span><input id="gravityX" type="number" step=".5" value="0"></label>
        <label class="mini-field"><span>Y 중력</span><input id="gravityY" type="number" step=".5" value="12"></label>
        <label class="mini-field"><span>격자</span><input id="gridSize" type="number" value="20"></label>
        <label class="check-row"><input id="snapGrid" type="checkbox" checked><span>격자에 맞춤</span></label>
      </div>

      <div class="panel-section">
        <p class="panel-title">추첨 규칙</p>
        <label class="mini-field"><span>유형</span>
          <select id="drawRuleType">
            <option value="RACE_FINISH">도착 순서</option>
            <option value="ORDERED_OUTPUT">순위별 출력</option>
            <option value="SLOT_COLLECTION">슬롯 수집</option>
            <option value="LAST_SURVIVOR">최후 생존</option>
            <option value="CASCADE_SELECTION">연속 선택</option>
            <option value="RANDOM_OUTPUT_BUCKET">랜덤 출력 버킷</option>
            <option value="CONDITIONAL_OUTPUT">조건부 출력</option>
          </select>
        </label>
        <label class="mini-field"><span>당첨자 수</span><input id="drawRuleWinnerCount" type="number" value="0"></label>
      </div>

      <div class="panel-section">
        <p class="panel-title">실행 정책</p>
        <label class="mini-field"><span>제한 시간 초 (0=끔)</span><input id="runTimeoutSeconds" type="number" step="1" value="0"></label>
        <label class="mini-field"><span>최소 당첨 인원</span><input id="qualificationMinWinners" type="number" step="1" value="0"></label>
        <label class="mini-field"><span>최대 보정 횟수 (0=끔)</span><input id="qualificationMaxNudges" type="number" step="1" value="0"></label>
      </div>
    </aside>

    <div
      class="maker-splitter maker-splitter-x"
      data-workspace-resize="palette"
      role="separator"
      aria-orientation="vertical"
      aria-label="도구 패널 너비 조절"
      title="드래그: 도구 패널 너비 조절 · 더블클릭: 기본값"
    ></div>

    <section class="maker-stage">
      <div class="stage-toolbar">
        <div class="preview-controls">
          <button id="previewToggle" class="primary-button">▶ 미리보기</button>
          <button id="previewReset" class="small-button">초기화</button>
          <label>구슬 수 <input id="marbleCount" type="number" value="16"></label>
          <label>난수 시드 <input id="previewSeed" type="number" value="1"></label>
          <div class="editor-zoom-controls" aria-label="맵 확대 축소">
            <button id="zoomOut" class="small-button" type="button" title="축소">−</button>
            <button id="zoomReset" class="small-button" type="button" title="100%로 초기화"><span id="zoomLabel">100%</span></button>
            <button id="zoomIn" class="small-button" type="button" title="확대">+</button>
          </div>
        </div>
        <div class="stage-status">
          <span id="modeStatus">편집</span>
          <strong id="simStatus">0 / 0</strong>
        </div>
      </div>
      <div class="map-canvas-wrap" id="mapCanvasWrap">
        <canvas id="mapCanvas"></canvas>
      </div>
      <div
        class="maker-splitter maker-splitter-y"
        data-workspace-resize="canvas"
        role="separator"
        aria-orientation="horizontal"
        aria-label="캔버스 높이 조절"
        title="드래그: 캔버스 높이 조절 · 더블클릭: 화면 높이에 맞춤"
      ></div>
      <div class="map-validation" id="mapValidation">맵을 편집한 뒤 미리보기로 즉시 테스트할 수 있습니다.</div>
    </section>

    <div
      class="maker-splitter maker-splitter-x"
      data-workspace-resize="inspector"
      role="separator"
      aria-orientation="vertical"
      aria-label="속성 패널 너비 조절"
      title="드래그: 속성 패널 너비 조절 · 더블클릭: 기본값"
    ></div>

    <aside class="maker-panel inspector-panel">
      <p class="panel-title">속성</p>
      <div id="emptyInspector" class="empty-inspector">컴포넌트를 선택하세요.</div>
      <div id="componentInspector" hidden>
        <div class="selected-type" id="selectedType">-</div>
        <button id="advancedSettingsToggle" class="small-button advanced-settings-toggle" type="button" aria-expanded="false">고급 설정 보기</button>
        <label class="mini-field"><span>X</span><input id="propX" type="number" step="1"></label>
        <label class="mini-field"><span>Y</span><input id="propY" type="number" step="1"></label>
        <label class="mini-field"><span>회전각</span><input id="propRotation" type="number" step="1" min="-360" max="360"></label>
        <label class="mini-field color-field"><span>채움색</span><input id="propVisualFill" type="color"></label>
        <label class="mini-field color-field"><span>테두리색</span><input id="propVisualStroke" type="color"></label>
        <label class="mini-field"><span>너비</span><input id="propWidth" type="number" step="1" min="0"></label>
        <label class="mini-field"><span>높이</span><input id="propHeight" type="number" step="1" min="0"></label>
        <label class="mini-field"><span>반지름</span><input id="propRadius" type="number" step="1" min="0"></label>
        <label class="mini-field"><span>탄성</span><input id="propRestitution" type="number" step=".05" min="0"></label>
        <label class="mini-field"><span>마찰</span><input id="propFriction" type="number" step=".01" min="0"></label>
        <label class="mini-field"><span>회전 속도 °/s</span><input id="propAngularSpeed" type="number" step="5"></label>
        <label class="mini-field"><span>회전판 수</span><input id="propBladeCount" type="number" min="1" max="4" step="1"></label>
        <label class="mini-field"><span>주기 초</span><input id="propPeriod" type="number" step=".1" min="0"></label>
        <label class="mini-field"><span>진폭 °</span><input id="propAmplitude" type="number" step="1" min="0" max="360"></label>
        <label class="mini-field"><span>열림 각도 °</span><input id="propOpenAngle" type="number" step="1" min="0" max="360"></label>
        <label class="mini-field"><span>레일 두께</span><input id="propThickness" type="number" step="1" min="0"></label>
        <label class="mini-field" title="0은 중심입니다. -0.5는 오브젝트의 긴 축 시작 끝점, +0.5는 반대 끝점입니다."><span>피벗 위치 비율</span><input id="propPivotRatio" type="number" step=".01"></label>
        <label class="mini-field"><span>최소 각도 °</span><input id="propLowerAngle" type="number" step="1" min="-360" max="360"></label>
        <label class="mini-field"><span>최대 각도 °</span><input id="propUpperAngle" type="number" step="1" min="-360" max="360"></label>
        <label class="mini-field"><span>관절 마찰</span><input id="propJointFriction" type="number" step=".1" min="0"></label>
        <label class="mini-field"><span>모터 속도 °/s</span><input id="propMotorSpeed" type="number" step="5"></label>
        <label class="mini-field"><span>모터 토크</span><input id="propMotorTorque" type="number" step="1" min="0"></label>
        <label class="mini-field"><span>버스트 세기</span><input id="propBurstPower" type="number" step=".05" min="0"></label>
        <label class="mini-field"><span>버스트 방향 °</span><input id="propBurstDirection" type="number" step="1" min="-360" max="360"></label>
        <label class="mini-field"><span>버스트 분산 ±°</span><input id="propBurstSpread" type="number" step="1" min="0" max="360"></label>
        <label class="mini-field"><span>버스트 세기 편차</span><input id="propBurstVariance" type="number" step=".01" min="0"></label>
        <label class="mini-field"><span>묶음 최소</span><input id="propBurstSizeMin" type="number" step="1"></label>
        <label class="mini-field"><span>묶음 최대</span><input id="propBurstSizeMax" type="number" step="1"></label>
        <label class="mini-field"><span>묶음 간격 ms</span><input id="propBurstInterval" type="number" step="10" min="0"></label>
        <label class="mini-field"><span>벨트 속도 px/s</span><input id="propBeltSpeed" type="number" step="10"></label>
        <label class="mini-field"><span>벨트 마찰 전달</span><input id="propBeltGrip" type="number" step=".05" min="0"></label>
        <label class="mini-field"><span>이동 방향 °</span><input id="propAxisAngle" type="number" step="1" min="-360" max="360"></label>
        <label class="mini-field"><span>이동 거리 px</span><input id="propTravelDistance" type="number" step="10" min="0"></label>
        <label class="mini-field"><span>이동 속도 px/s</span><input id="propElevatorSpeed" type="number" step="1" min="0"></label>
        <label class="mini-field"><span>출력 키</span><input id="propOutputKey"></label>
        <label class="mini-field"><span>출력 순위</span><input id="propOutputRank" type="number" step="1"></label>
        <label class="mini-field"><span>출력 용량</span><input id="propOutputCapacity" type="number" step="1"></label>
        <label class="mini-field"><span>출력 가중치</span><input id="propOutputWeight" type="number" step=".05"></label>
        <label class="mini-field"><span>출력 우선순위</span><input id="propOutputPriority" type="number" step="1"></label>
        <label class="mini-field"><span>센서 태그</span><input id="propSensorTag" placeholder="optional"></label>
        <label class="mini-field"><span>조건</span>
          <select id="propConditionType">
            <option value="ALWAYS">항상</option>
            <option value="AFTER_ANY_CLAIM">아무 당첨 이후</option>
            <option value="AFTER_OUTPUT_CLAIMS">출력 당첨 수 충족 후</option>
            <option value="AFTER_OUTPUT_FULL">출력 가득 참 이후</option>
            <option value="AFTER_SECONDS">지정 시간 이후</option>
            <option value="AFTER_SENSOR_CLAIMS">센서 감지 수 충족 후</option>
            <option value="AFTER_BRANCH_STATE">분기 상태 충족 후</option>
          </select>
        </label>
        <label class="mini-field"><span>조건 출력</span><select id="propConditionOutputKey"><option value="">없음</option></select></label>
        <label class="mini-field"><span>조건 당첨 수</span><input id="propConditionClaims" type="number" step="1"></label>
        <label class="mini-field"><span>조건 시간 초</span><input id="propConditionSeconds" type="number" step=".1"></label>
        <label class="mini-field"><span>조건 센서</span><select id="propConditionSensorTag"><option value="">없음</option></select></label>
        <label class="mini-field"><span>분기 키</span><input id="propConditionBranchKey"></label>
        <label class="mini-field"><span>분기 값</span><input id="propConditionBranchValue"></label>
        <label class="mini-field"><span>설정할 분기 키</span><input id="propBranchSetKey" placeholder="optional"></label>
        <label class="mini-field"><span>설정할 분기 값</span><input id="propBranchSetValue" value="ON"></label>
        <label class="mini-field"><span>슬롯 키</span><input id="propSlotKey"></label>
        <label class="mini-field"><span>슬롯 용량</span><input id="propSlotCapacity" type="number" step="1"></label>
        <label class="mini-field"><span>탈락 키</span><input id="propEliminationKey"></label>
        <label class="mini-field"><span>충돌 재질음</span>
          <select id="propSoundMaterial">
            <option value="metal">금속</option>
            <option value="wood">나무</option>
            <option value="glass">유리</option>
            <option value="rubber">고무</option>
            <option value="plastic">플라스틱</option>
            <option value="stone">돌</option>
          </select>
        </label>
        <label class="mini-field"><span>악기</span>
          <select id="propInstrument">
            <option value="none">재질음만</option>
            <option value="bell">벨</option>
            <option value="chime">차임</option>
            <option value="xylophone">실로폰</option>
            <option value="drum">드럼</option>
            <option value="click">클릭</option>
          </select>
        </label>
        <label class="mini-field"><span>MIDI 음정</span><input id="propAudioNote" type="number" step="1" min="24" max="108"></label>
        <label class="mini-field"><span>오디오 게인</span><input id="propAudioGain" type="number" step=".05" min="0" max="2"></label>
        <label class="mini-field"><span>오디오 팬</span><input id="propAudioPan" type="number" step=".05" min="-1" max="1"></label>
        <div class="mini-field audio-preview-field">
          <span>현재 음정</span>
          <button id="previewAudioNote" class="small-button" type="button" data-tooltip="현재 재질/악기와 MIDI 음정 설정을 실제 추첨용 사운드 뱅크로 재생합니다.">▶ 미리듣기</button>
        </div>
        <label class="mini-field"><span>추가 반발력</span><input id="propBoost" type="number" step=".05" min="0"></label>
        <label class="mini-field"><span>구슬 반지름</span><input id="propMarbleRadius" type="number" step="1" min="0"></label>
      </div>

      <div class="panel-section map-meta">
        <p class="panel-title">맵 정보</p>
        <div><span>ID</span><strong id="mapIdLabel">신규</strong></div>
        <div><span>리비전</span><strong id="mapRevision">-</strong></div>
        <div><span>해시</span><strong id="mapHash">-</strong></div>
      </div>
    </aside>
  </section>
</main>
