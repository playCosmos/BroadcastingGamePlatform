<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>방송 게임 플랫폼 · 보드게임 룸 생성</title>
  <link rel="stylesheet" href="/admin/assets/base.css" />
  <link rel="stylesheet" href="/admin/assets/board-room-admin.css" />
  <style>
    .board-admin-version-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      color: #7f8a98;
      font-size: 10px;
      font-weight: 800;
    }
    @media(max-width:760px){
      .board-admin-version-line { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="admin-shell board-room-admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">BROADCASTING GAME PLATFORM / BOARD</p>
        <h1>보드게임 룸 생성</h1><p><a class="nav-link" href="/admin/">← 플랫폼 홈</a></p>
      </div>
      <div class="board-admin-version-line">
        <span id="boardRoomAdminUiVersion">룸 관리 UI v-</span>
        <span>·</span>
        <span id="boardServerVersion">서버 v-</span>
      </div>
    </header>

    <section class="board-room-panel" id="boardRoomPanel">
      <form class="board-room-form" id="boardRoomForm">
        <section class="board-room-primary-panel" aria-labelledby="boardRoomBasicsHeading">
          <div class="board-room-group-heading">
            <h2 id="boardRoomBasicsHeading">룸 기본 설정</h2>
          </div>
          <section class="board-room-settings-section">
          <h3>룸 정보</h3>
          <div class="board-room-basic-grid">
            <label>룸 이름
              <input name="roomName" autocomplete="off" value="Board Room" maxlength="120" />
            </label>
            <label>룸 유지 시간(분)
              <input name="retentionMinutes" type="number" min="1" max="480" step="1" value="240" />
            </label>
            <label>일시정지 중 후원
              <select name="pauseDonationMode">
                <option value="QUEUE" selected>유예시간 동안 큐에 저장 후 이후 무시</option>
                <option value="IGNORE">일시정지 즉시 무시</option>
              </select>
            </label>
            <label>일시정지 후원 유예(초)
              <input name="pauseGraceSeconds" type="number" min="0" max="120" step="1" value="10" />
            </label>
          </div>
        </section>
          <section class="board-room-settings-section">
          <h3>참가자</h3>
          
          <div class="board-room-player-list" id="boardRoomPlayers"></div>
          <div class="board-room-player-add-row">
            <button type="button" id="boardRoomAddPlayer">+ 참가자 추가</button>
            <span id="boardRoomPlayerLimitState">최대 6명</span>
          </div>
        </section>
          <section class="board-room-settings-section">
          <h3>이동방식</h3>
          <div class="board-room-generator-choice-grid">
            <section class="board-room-generator-card">
              <label class="board-room-generator-toggle">
                <input id="boardRoomDiceEnabled" type="checkbox" checked />
                <strong>주사위</strong>
              </label>
              <div class="board-room-generator-suboptions" id="boardRoomDiceFields">
                <label class="board-room-generator-primary-option">주사위 개수
                  <select name="diceCount">
                    <option value="1">1개</option>
                    <option value="2" selected>2개</option>
                  </select>
                </label>
                <label class="check-label board-room-generator-bonus-option">
                  <input name="extraThrowOnDouble" type="checkbox" checked />
                  더블이 나오면 한번 더 던지기
                </label>
              </div>
            </section>

            <section class="board-room-generator-card">
              <label class="board-room-generator-toggle">
                <input id="boardRoomYutEnabled" type="checkbox" checked />
                <strong>윷</strong>
              </label>
              <div class="board-room-generator-suboptions" id="boardRoomYutFields">
                <span class="board-room-generator-option-spacer" aria-hidden="true"></span>
                <label class="check-label board-room-generator-bonus-option">
                  <input name="extraThrowOnYutMo" type="checkbox" checked />
                  윷/모가 나오면 한번 더 던지기
                </label>
              </div>
            </section>
          </div>
          
        </section>
          <details class="board-room-preset-panel">
          <summary>설정 저장 · 불러오기</summary>
          <div class="board-room-preset-grid">
            <label>저장 이름
              <input id="boardRoomPresetName" type="text" maxlength="80" autocomplete="off" placeholder="예: 기본 2인 보드" />
            </label>
            <label>저장된 설정
              <select id="boardRoomPresetSelect">
                <option value="">저장된 설정 선택</option>
              </select>
            </label>
            <div class="board-room-preset-actions">
              <button type="button" id="boardRoomPresetSave">현재 설정 저장</button>
              <button type="button" id="boardRoomPresetLoad">불러오기</button>
              <button type="button" id="boardRoomPresetDelete">삭제</button>
            </div>
          </div>
          
        </details>
        </section>
        <section class="board-room-workspace-panel" aria-labelledby="boardRoomWorkspaceHeading">
          <h2 id="boardRoomWorkspaceHeading">보드 설정</h2>
          <div class="board-room-workspace-grid">
            <div class="board-room-editor-pane">
              <section class="board-room-settings-section">
          <h3>칸 효과</h3>
          
          <div class="board-room-instruction-editor">
            <aside class="board-room-instruction-sidebar">
              <div class="board-room-instruction-toolbar">
                <button type="button" class="board-room-small-button" data-add-board-instruction="custom">+ 사용자 지시문 추가</button>
              </div>
              <div class="board-room-instruction-master-list" id="boardRoomInstructionList"></div>
            </aside>

            <section class="board-room-instruction-property-view">
              <div class="board-room-property-empty" id="boardRoomInstructionEmptyState">
                왼쪽 목록에서 지시문을 선택하세요.
              </div>
              <div class="board-room-instruction-list" id="boardRoomInstructionRows"></div>
            </section>
          </div>

          <div class="board-room-random-row" id="boardRoomRandomOptions" hidden>
            <label>랜덤 칸 후보 선택 방식
              <select id="boardRoomRandomPoolMode">
                <option value="custom" selected>후보 직접 선택 · 가중치 설정</option>
                <option value="inheritRatioInstructions">활성 비율 효과 자동 포함</option>
              </select>
            </label>
            <p class="board-room-rule-note">랜덤 칸을 활성화하면, 체크한 효과 중에서 하나를 선택합니다. 직접 선택 시 후보를 1개 이상 체크하세요.</p>
          </div>
        </section>
            </div>
            <section class="board-room-board-preview" aria-label="보드 크기·모양과 실제 배치">
              <div class="board-room-size-controls">
                <section class="board-room-settings-section">
          <h3>보드 크기·모양</h3>
          <div class="board-room-board-grid">
            <label>크기 입력 방식
              <select id="boardRoomSizingMode">
                <option value="dimensions">가로/세로</option>
                <option value="cellCount">전체 칸 수</option>
              </select>
            </label>
            <label>모서리 형상
              <select name="layoutStyle">
                <option value="rounded">라운드</option>
                <option value="rect">직각</option>
              </select>
            </label>
            <span class="board-room-field-cluster" id="boardRoomDimensionsFields">
              <label>가로 칸
                <input name="columns" type="number" min="8" max="64" step="1" value="12" />
              </label>
              <label>세로 칸
                <input name="rows" type="number" min="6" max="48" step="1" value="8" />
              </label>
            </span>
            <label id="boardRoomCellCountField" hidden>전체 외곽 칸 수
              <input name="cellCount" type="number" min="24" step="2" value="36" />
            </label>
          </div>
        </section>
              </div>
              <div class="board-room-preview-panel" id="boardRoomPreviewPanel">
                <div class="board-room-preview-head">
                  <h3>실제 보드 배치</h3>
                  <p class="board-room-preview-meta" id="boardRoomPreviewMeta"></p>
                </div>
                <div class="board-room-preview-shell">
                  <div class="board-room-preview-placeholder" id="boardRoomPreviewPlaceholder">
                    <strong>실제 보드 배치 대기 중</strong>
                    <span>배치를 누르면 서버에서 생성된 실제 룸 보드가 표시됩니다.</span>
                  </div>
                  <iframe id="boardRoomPreviewFrame" title="실제 룸 배치" loading="lazy" hidden></iframe>
                </div>
              </div>
              <div class="board-room-create-actions">
                <div class="board-room-layout-actions">
                  <button type="submit" id="boardRoomCreateButton" aria-label="보드 칸 효과를 무작위로 배치">
                    <svg class="board-room-action-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M25.6 10.9C22 4.5 13.6 3 8 7.5C3 7.5 3.4 7 3 13C2.6 20.9 7.7 26.9 15.5 27.6"/><path d="M18.4 8.5L26.4 12.2C29.4 13.3 30.1 9 28.3 4"/></svg>
                    <span data-placement-label>배치</span>
                  </button>
                  <button type="button" id="boardRoomCommitButton" disabled aria-label="이 보드 배치를 확정">
                    <svg class="board-room-action-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 16.5C8 18.4 11.1 26 13.1 25C18.7 16.3 24.8 11 30 6.7"/></svg>
                    <span data-commit-label>이 배치로 확정</span>
                  </button>
                </div>
                <p class="operation-result" id="boardRoomResult" aria-live="polite"></p>
              </div>
            </section>
          </div>
        </section>
      </form>
    </section>
  </main>

  <script>
    (() => {
      async function refreshRoomAdminMeta() {
        try {
          const response = await fetch("/api/state", { cache: "no-store" });
          if (!response.ok) throw new Error(response.statusText);
          const state = await response.json();

          document.getElementById("boardRoomAdminUiVersion").textContent =
            "룸 관리 UI v" + (state.roomAdminUiVersion || "-");
          document.getElementById("boardServerVersion").textContent =
            "서버 v" + (state.version || "-");

        } catch (_) {
        }
      }

      refreshRoomAdminMeta();
      setInterval(refreshRoomAdminMeta, 3000);
    })();
  </script>
  <script src="/admin/assets/board-room-admin.js"></script>
</body>
</html>
