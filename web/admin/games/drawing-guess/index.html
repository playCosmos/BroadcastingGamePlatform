<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>방송 게임 플랫폼 · Drawing Guess 룸 생성</title>
  <link rel="stylesheet" href="/assets/platform.css">
  <link rel="stylesheet" href="/admin/assets/drawing-guess.css">
</head>
<body>
  <main class="shell drawing-admin">
    <header class="hero compact">
      <p class="eyebrow">DRAWING GUESS / ROOM CREATE</p>
      <h1>Drawing Guess</h1>
      <p class="lead">방송인 전담 출제 또는 참가자 순환 출제를 선택하고 참가자·점수·라운드 시간을 설정합니다.</p>
      <div class="hero-actions">
        <a class="secondary" href="/admin/">← 운영자 홈</a>
      </div>
    </header>

    <section class="drawing-create-grid">
      <article class="draw-panel">
        <h2>게임 설정</h2>

        <label class="field">
          <span>룸 이름</span>
          <input id="roomName" type="text" value="Drawing Guess" maxlength="80">
        </label>

        <label class="field">
          <span>출제 방식</span>
          <select id="drawerPolicy">
            <option value="STREAMER_DRAWER">방송인이 계속 출제</option>
            <option value="ROTATING_DRAWER">참가자가 돌아가며 출제</option>
          </select>
        </label>

        <label class="field" id="streamerIdField">
          <span>방송인 내부 ID</span>
          <input id="streamerParticipantId" type="text" value="streamer" maxlength="80">
          <small>방송인을 참가자 점수판에 넣지 않아도 됩니다.</small>
        </label>

        <div class="inline-fields">
          <label class="field">
            <span>라운드 시간(초)</span>
            <input id="roundDurationSeconds" type="number" min="10" max="600" value="80">
          </label>
          <label class="field">
            <span>점수 정책</span>
            <select id="scoreProfile">
              <option value="FAST_GUESS">빠른 정답 우대</option>
              <option value="RANKED">정답 순위형</option>
              <option value="NO_SCORE">점수 없음</option>
            </select>
          </label>
        </div>

        <section class="chat-option-panel">
          <label class="toggle-row">
            <input id="chatGuessEnabled" type="checkbox" checked>
            <span>
              <strong>채팅 정답 사용</strong>
              <small>끄면 Canvas/룸 게임만 사용하고 채팅은 정답 판정에 사용하지 않습니다.</small>
            </span>
          </label>
          <div class="inline-fields" id="chatBindingFields">
            <label class="field">
              <span>Chat Provider</span>
              <select id="chatProvider">
                <option value="SOOP">SOOP</option>
              </select>
            </label>
            <label class="field">
              <span>채널 ID · 선택</span>
              <input id="chatChannelId" type="text" placeholder="비워두면 해당 Provider의 현재 채널">
            </label>
          </div>
        </section>

        <details class="score-details">
          <summary>점수 세부 설정</summary>
          <div class="score-grid">
            <label class="field"><span>최대 정답 점수</span><input id="maxGuessPoints" type="number" min="0" value="500"></label>
            <label class="field"><span>최소 정답 점수</span><input id="minGuessPoints" type="number" min="0" value="100"></label>
            <label class="field"><span>순위당 감점</span><input id="rankPenaltyPoints" type="number" min="0" value="25"></label>
            <label class="field"><span>정답 1명당 출제자 점수</span><input id="drawerPointsPerCorrect" type="number" min="0" value="50"></label>
          </div>
        </details>
      </article>

      <article class="draw-panel">
        <h2>참가자</h2>
        <p class="helper">순환 출제자는 한 줄에 한 명 입력합니다. <code>표시명 | SOOP | 사용자ID</code> 형식으로 계정을 연결할 수 있습니다. 방송인 전담 모드는 참가자 목록을 비워도 되며, 정답을 맞힌 채팅 시청자가 자동으로 점수판에 등록됩니다.</p>
        <label class="field">
          <span>참가자 목록</span>
          <textarea id="participants" rows="14" placeholder="철수&#10;영희&#10;민수 | SOOP | user123"></textarea>
        </label>
        <div class="participant-preview" id="participantPreview"></div>

        <div class="draw-actions">
          <button class="primary-button" id="createRoomButton" type="button">룸 생성</button>
        </div>
        <p class="status-line" id="createStatus">참가자를 입력하세요.</p>
      </article>
    </section>
  </main>

  <script src="/admin/assets/drawing-guess-create.js"></script>
</body>
</html>
