name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release version
        shell: pwsh
        run: |
          # Publish only from main or a deliberate release branch; staged
          # GameRoom and Yacht Draft PR refs must never produce a release.
          $releaseRef = "${{ github.ref }}"
          if ($releaseRef -ne "refs/heads/main" -and
              $releaseRef -notmatch '^refs/heads/release/[A-Za-z0-9._/-]+$') {
            throw "release must use main or release/*: $releaseRef"
          }
          $version = "${{ inputs.version }}".Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "invalid release version: $version"
          }

          $notes = "docs/releases/v$version.md"
          if (-not (Test-Path $notes)) {
            throw "release notes missing: $notes"
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP=BroadcastingGamePlatformServer-Windows-x64-v$version.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check PowerShell scripts
        shell: pwsh
        run: ./server/check-powershell.ps1

      - name: Prepare browser physics assets
        shell: pwsh
        run: ./server/prepare-browser-physics.ps1

      - name: Check browser JavaScript
        shell: pwsh
        run: ./server/check-browser-javascript.ps1

      - name: Smoke box2d-wasm in browser
        shell: pwsh
        run: ./server/smoke-browser-physics.ps1

      - name: Smoke board layouts in browser
        shell: pwsh
        run: ./server/smoke-board-layouts.ps1

      - name: Build platform server
        working-directory: server
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Run release regression probes
        working-directory: server
        shell: pwsh
        run: ./run-regression-probes.ps1

      - name: Real GameRoom Chrome Edge browser E2E
        shell: pwsh
        run: ./server/smoke-game-room-browser.ps1

      - name: Build Windows x64 app
        working-directory: server
        shell: pwsh
        run: ./package-windows.ps1 -Version $env:RELEASE_VERSION -SkipBuild

      - name: Verify packaged app
        working-directory: server
        shell: pwsh
        run: |
          $root = Resolve-Path "dist/BroadcastingGamePlatformServer"
          $exe = Join-Path $root "BroadcastingGamePlatformServer.exe"

          if (-not (Test-Path $exe)) { throw "platform executable missing" }
          if (Test-Path (Join-Path $root "config.json")) { throw "live config.json must not be shipped" }
          if (-not (Test-Path (Join-Path $root "config.example.json"))) { throw "config.example.json missing" }
          if (-not (Test-Path (Join-Path $root "runtime/bin/server/jvm.dll"))) { throw "bundled runtime missing" }
          if (-not (Test-Path (Join-Path $root "THIRD_PARTY_NOTICES.md"))) { throw "third-party notices missing" }

          $probe = Start-Process -FilePath $exe -ArgumentList "--board-server-probe" -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            throw "packaged platform server probe failed: $($probe.ExitCode)"
          }

      - name: R14h extended WebSocket endurance (24 rounds)
        working-directory: server
        shell: pwsh
        run: |
          $classPath = @("target/test-classes", "target/classes", "target/probe-dependencies/*") -join [IO.Path]::PathSeparator
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14j-soak.jsonl"
          java -cp $classPath io.github.playcosmos.broadcastinggameplatform.boardserver.GameRoomWebSocketEnduranceR14gProbe --rounds=24 "--report=$report"
          if ($LASTEXITCODE -ne 0) { throw "R14h extended WebSocket endurance failed: $LASTEXITCODE" }

      - name: R14j validate and summarize soak metrics
        working-directory: server
        shell: pwsh
        run: |
          node --check ./analyze-game-room-soak.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14j analyzer JavaScript invalid" }
          node ./analyze-game-room-soak.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14j analyzer contract self-test failed" }
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14j-soak.jsonl"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14j-summary.json"
          node ./analyze-game-room-soak.mjs "--input=$report" "--summary=$summary" --min-rounds=24
          if ($LASTEXITCODE -ne 0) { throw "R14j telemetry missing, corrupt, or out-of-order" }
          Get-Content $summary

      - name: R14e packaged GameRoom startup and crash-restart
        shell: pwsh
        run: ./server/smoke-packaged-game-room-restart.ps1

      - name: R14h packaged GameRoom graceful exit and restart
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14k-packaged-exe.json"
          $load = Join-Path $env:RUNNER_TEMP "game-room-r14l-packaged-load.json"
          $ws = Join-Path $env:RUNNER_TEMP "game-room-r14m-packaged-ws.json"
          $duration = Join-Path $env:RUNNER_TEMP "game-room-r14n-packaged-duration.json"
          ./server/smoke-packaged-game-room-restart.ps1 -StopMode Graceful -TelemetryPath $report -LoadRounds 24 -LoadReportPath $load -WsSpectators 12 -WsReportPath $ws -WsSoakCycles 6 -WsSoakReportPath $duration

      - name: R14k validate packaged EXE resource samples
        working-directory: server
        shell: pwsh
        run: |
          node --check ./analyze-packaged-process-telemetry.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14k analyzer JavaScript invalid" }
          node ./analyze-packaged-process-telemetry.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14k analyzer self-test failed" }
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14k-packaged-exe.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14k-summary.json"
          node ./analyze-packaged-process-telemetry.mjs "--input=$report" "--summary=$summary"
          if ($LASTEXITCODE -ne 0) { throw "R14k packaged process telemetry invalid" }
          Get-Content $summary

      - name: R14l verify packaged JVM HTTP SQLite soak (48 rounds)
        working-directory: server
        shell: pwsh
        run: |
          node --check ./analyze-packaged-http-soak.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14l analyzer syntax invalid" }
          node ./analyze-packaged-http-soak.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14l analyzer self-test failed" }
          $load = Join-Path $env:RUNNER_TEMP "game-room-r14l-packaged-load.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14l-summary.json"
          node ./analyze-packaged-http-soak.mjs "--input=$load" "--summary=$summary" --min-rounds=24
          if ($LASTEXITCODE -ne 0) { throw "R14l packaged HTTP/SQLite workload or JVM measurements invalid" }
          Get-Content $summary

      - name: R14m verify real packaged spectator WebSocket fanout
        working-directory: server
        shell: pwsh
        run: |
          node --check ./smoke-packaged-websocket-fanout.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14m packaged WebSocket client syntax invalid" }
          node --check ./analyze-packaged-ws-fanout.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14m analyzer syntax invalid" }
          node ./analyze-packaged-ws-fanout.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14m strict contract self-test failed" }
          $ws = Join-Path $env:RUNNER_TEMP "game-room-r14m-packaged-ws.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14m-summary.json"
          node ./analyze-packaged-ws-fanout.mjs "--input=$ws" "--summary=$summary"
          if ($LASTEXITCODE -ne 0) { throw "R14m packaged WS fanout/replay evidence invalid" }
          Get-Content $summary

      - name: R14n verify packaged Windows listener-JVM duration trend
        working-directory: server
        shell: pwsh
        run: |
          node --check ./analyze-packaged-ws-duration.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14n analyzer syntax invalid" }
          node ./analyze-packaged-ws-duration.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14n mutation self-test failed" }
          $duration = Join-Path $env:RUNNER_TEMP "game-room-r14n-packaged-duration.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14n-summary.json"
          node ./analyze-packaged-ws-duration.mjs "--input=$duration" "--summary=$summary"
          if ($LASTEXITCODE -ne 0) { throw "R14n real packaged listener JVM duration measurements invalid" }
          Get-Content $summary

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "server/dist/BroadcastingGamePlatformServer" -DestinationPath $env:RELEASE_ZIP -CompressionLevel Optimal
          $hash = (Get-FileHash $env:RELEASE_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$($env:RELEASE_ZIP).sha256" -Value "$hash  $($env:RELEASE_ZIP)" -Encoding ascii
          Write-Host "SHA256 $hash"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = $env:RELEASE_TAG
          $zip = $env:RELEASE_ZIP
          $checksum = "$zip.sha256"

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag `
              --repo $repo `
              --target "${{ github.sha }}" `
              --title "Broadcasting Game Platform $tag" `
              --notes-file $env:RELEASE_NOTES
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            gh release upload $tag $zip $checksum `
              --repo $repo `
              --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag $zip $checksum `
              --repo $repo `
              --target "${{ github.sha }}" `
              --title "Broadcasting Game Platform $tag" `
              --notes-file $env:RELEASE_NOTES
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
