name: TTS Training Tooling (No GPU, No Models)

on:
  workflow_dispatch:
  push:
    branches: [feature/tts-training-environment]
    paths:
      - 'tools/tts-training/**'
      - '.github/workflows/tts-training-tooling.yml'
  pull_request:
    paths:
      - 'tools/tts-training/**'
      - '.github/workflows/tts-training-tooling.yml'

permissions:
  contents: read

jobs:
  offline-training-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check Python and Bash syntax
        run: |
          python -m compileall -q tools/tts-training
          bash -n tools/tts-training/setup.sh
          bash -n tools/tts-training/train.sh
      - name: Check Conda/system Python selection without installing packages
        run: |
          GC_TTS_PYTHON="$(command -v python)" bash tools/tts-training/setup.sh --check-python
          if GC_TTS_PYTHON=/bin/false bash tools/tts-training/setup.sh --check-python; then
            echo "ERROR: unsupported interpreter was accepted" >&2
            exit 1
          fi
          test ! -e tools/tts-training/.venv
      - name: Run offline data and safety tests
        run: python -m unittest discover -s tools/tts-training/tests -p 'test_*.py' -v
      - name: Check empty environment diagnosis
        run: python tools/tts-training/doctor.py --json
