name: Broadcasting Game Platform Windows Package

on:
  workflow_dispatch:
  push:
    # Preserve CI for each active staged branch without editing this workflow
    # every time a new R/Y integration PR is stacked.
    branches:
      - main
      - 'feature/yacht-y*'
      - 'feature/common-game-room-*'
    paths:
      - "server/**"
      - "web/**"
      - "docs/**"
      - ".github/workflows/platform-windows-package.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release.yml"
  pull_request:
    # These patterns cover current and future staged GameRoom/Yacht bases.
    # GitHub evaluates pull_request.branches against the PR BASE branch.
    branches:
      - main
      - 'feature/yacht-y*'
      - 'feature/common-game-room-*'
    paths:
      - "server/**"
      - "web/**"
      - "docs/**"
      - ".github/workflows/platform-windows-package.yml"

permissions:
  contents: read

concurrency:
  group: platform-windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check PowerShell scripts
        shell: pwsh
        run: ./server/check-powershell.ps1

      - name: Check workflow integration release gates
        shell: pwsh
        run: ./server/check-integration-workflows.ps1

      - name: Prepare browser physics assets
        shell: pwsh
        run: ./server/prepare-browser-physics.ps1

      - name: Check browser JavaScript
        shell: pwsh
        run: ./server/check-browser-javascript.ps1

      - name: Smoke box2d-wasm in browser
        shell: pwsh
        run: ./server/smoke-browser-physics.ps1

      - name: Smoke board layouts in browser
        shell: pwsh
        run: ./server/smoke-board-layouts.ps1

      - name: Build platform server
        working-directory: server
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Run platform regression probes
        working-directory: server
        shell: pwsh
        run: ./run-regression-probes.ps1

      - name: Real GameRoom Chrome Edge browser E2E
        shell: pwsh
        run: ./server/smoke-game-room-browser.ps1

      - name: Build Windows app
        working-directory: server
        shell: pwsh
        run: ./package-windows.ps1 -Version 0.1.0 -SkipBuild

      - name: Verify package
        working-directory: server
        shell: pwsh
        run: |
          $root = Resolve-Path "dist/BroadcastingGamePlatformServer"
          $exe = Join-Path $root "BroadcastingGamePlatformServer.exe"

          if (-not (Test-Path $exe)) { throw "platform executable missing" }
          if (Test-Path (Join-Path $root "config.json")) { throw "live config.json must not be shipped" }
          if (-not (Test-Path (Join-Path $root "config.example.json"))) { throw "config.example.json missing" }
          if (-not (Test-Path (Join-Path $root "runtime/bin/server/jvm.dll"))) { throw "bundled runtime missing" }
          if (-not (Test-Path (Join-Path $root "THIRD_PARTY_NOTICES.md"))) { throw "third-party notices missing" }
          if (-not (Test-Path (Join-Path $root "web/vendor/box2d-wasm/entry.js"))) { throw "packaged box2d-wasm entry missing" }
          if (-not (Test-Path (Join-Path $root "web/vendor/box2d-wasm/Box2D.simd.wasm"))) { throw "packaged box2d-wasm SIMD wasm missing" }

          @(
            "web/index.html",
            "web/assets/platform.css",
            "web/admin/index.html",
            "web/admin/assets/platform-admin.js",
            "web/admin/assets/viewer-draw.css",
            "web/admin/assets/viewer-draw-number.js",
            "web/admin/assets/viewer-draw.js",
            "web/admin/assets/viewer-draw-map-engine.js",
            "web/admin/assets/viewer-draw-map-maker.js",
            "web/admin/assets/viewer-draw-map-maker.css",
            "web/admin/tools/viewer-draw/index.html",
            "web/admin/tools/viewer-draw/map-maker/index.html",
            "web/tools/viewer-draw/marble/index.html",
            "web/tools/viewer-draw/marble/browser-physics-adapter.js",
            "web/tools/viewer-draw/marble/viewer-draw-marble.js",
            "web/tools/viewer-draw/marble/viewer-draw-marble.css",
            "web/admin/games/yacht/index.html",
            "web/games/yacht/index.html",
            "web/games/yacht/yacht.css",
            "web/games/yacht/yacht.js",
            "web/admin/games/drawing-guess/index.html",
            "web/admin/games/drawing-guess/room.html",
            "web/admin/assets/drawing-guess.css",
            "web/admin/assets/drawing-guess-canvas.js",
            "web/admin/assets/drawing-guess-create.js",
            "web/admin/assets/drawing-guess-room.js",
            "web/games/drawing-guess/index.html",
            "web/games/drawing-guess/room/index.html",
            "web/games/drawing-guess/room/room.css",
            "web/games/drawing-guess/room/room.js",
            "web/games/drawing-guess/drawing-guess-overlay.css",
            "web/games/drawing-guess/drawing-guess-overlay.js",
            "web/tools/viewer-draw/index.html",
            "web/tools/viewer-draw/viewer-draw-overlay.js",
            "web/admin/games/board/index.html",
            "web/admin/games/board/room.html",
            "web/admin/assets/board-room-admin.js",
            "web/admin/assets/board-room-operation.js",
            "web/server-management.html",
            "web/games/board/index.html",
            "web/games/board/rect.html",
            "web/games/board/js/board.js",
            "web/games/board/js/board-rect.js"
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $root $_))) {
              throw "required platform asset missing: $_"
            }
          }

          Get-ChildItem (Join-Path $root "web") -Recurse -File | ForEach-Object {
            $text = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
            if ($text -match "먀로또|roulette-ui|roulette-core|ticket-renderer") {
              throw "roulette/lotto artifact must not exist: $($_.FullName)"
            }
          }

          $landing = Get-Content (Join-Path $root "web/index.html") -Raw
          if ($landing -notmatch "보드게임") { throw "board game missing from platform landing" }
          if ($landing -notmatch "GAME 02" -or $landing -notmatch "Yacht") {
            throw "Yacht GAME 02 development card missing from landing"
          }
          # R4 exposes a playable BETA Yacht client; verify its OWN card,
          # not an obsolete Y2-only status (GAME 03 remains independent).
          if ($landing -notmatch '(?s)<article class="game-card available">(?:(?!</article>).)*R4 · MULTIPLAYER BETA(?:(?!</article>).)*GAME 02(?:(?!</article>).)*href="/games/yacht/"') {
            throw "Yacht GAME 02 R4 beta card must link to independent game client"
          }
          if ($landing -match "먀로또|로또") { throw "lotto must not appear on platform landing" }

          $probe = Start-Process -FilePath $exe -ArgumentList "--board-server-probe" -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            throw "packaged platform server probe failed: $($probe.ExitCode)"
          }

      - name: R14h extended WebSocket endurance (24 rounds)
        working-directory: server
        shell: pwsh
        run: |
          $classPath = @("target/test-classes", "target/classes", "target/probe-dependencies/*") -join [IO.Path]::PathSeparator
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14j-soak.jsonl"
          java -cp $classPath io.github.playcosmos.broadcastinggameplatform.boardserver.GameRoomWebSocketEnduranceR14gProbe --rounds=24 "--report=$report"
          if ($LASTEXITCODE -ne 0) { throw "R14h extended WebSocket endurance failed: $LASTEXITCODE" }

      - name: R14j validate and summarize soak metrics
        working-directory: server
        shell: pwsh
        run: |
          node --check ./analyze-game-room-soak.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14j analyzer JavaScript invalid" }
          node ./analyze-game-room-soak.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14j analyzer contract self-test failed" }
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14j-soak.jsonl"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14j-summary.json"
          node ./analyze-game-room-soak.mjs "--input=$report" "--summary=$summary" --min-rounds=24
          if ($LASTEXITCODE -ne 0) { throw "R14j telemetry missing, corrupt, or out-of-order" }
          Get-Content $summary

      - name: R14e packaged GameRoom startup and crash-restart
        shell: pwsh
        run: ./server/smoke-packaged-game-room-restart.ps1

      - name: R14h packaged GameRoom graceful exit and restart
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14k-packaged-exe.json"
          $load = Join-Path $env:RUNNER_TEMP "game-room-r14l-packaged-load.json"
          $ws = Join-Path $env:RUNNER_TEMP "game-room-r14m-packaged-ws.json"
          $duration = Join-Path $env:RUNNER_TEMP "game-room-r14n-packaged-duration.json"
          $yacht = Join-Path $env:RUNNER_TEMP "game-room-r14r-packaged-yacht.json"
          $playerWs = Join-Path $env:RUNNER_TEMP "game-room-r14s-yacht-player-ws.json"
          $consistency = Join-Path $env:RUNNER_TEMP "game-room-r14t-consistency.json"
          ./server/smoke-packaged-game-room-restart.ps1 -StopMode Graceful -TelemetryPath $report -LoadRounds 24 -LoadReportPath $load -WsSpectators 12 -WsReportPath $ws -WsSoakCycles 6 -WsSoakReportPath $duration -YachtReportPath $yacht -YachtWsReportPath $playerWs -ConsistencyReportPath $consistency

      - name: R14k validate packaged EXE resource samples
        working-directory: server
        shell: pwsh
        run: |
          node --check ./analyze-packaged-process-telemetry.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14k analyzer JavaScript invalid" }
          node ./analyze-packaged-process-telemetry.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14k analyzer self-test failed" }
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14k-packaged-exe.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14k-summary.json"
          node ./analyze-packaged-process-telemetry.mjs "--input=$report" "--summary=$summary"
          if ($LASTEXITCODE -ne 0) { throw "R14k packaged process telemetry invalid" }
          Get-Content $summary

      - name: R14l verify packaged JVM HTTP SQLite soak (48 rounds)
        working-directory: server
        shell: pwsh
        run: |
          node --check ./analyze-packaged-http-soak.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14l analyzer syntax invalid" }
          node ./analyze-packaged-http-soak.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14l analyzer self-test failed" }
          $load = Join-Path $env:RUNNER_TEMP "game-room-r14l-packaged-load.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14l-summary.json"
          node ./analyze-packaged-http-soak.mjs "--input=$load" "--summary=$summary" --min-rounds=24
          if ($LASTEXITCODE -ne 0) { throw "R14l packaged HTTP/SQLite workload or JVM measurements invalid" }
          Get-Content $summary

      # R14l is disposable sequential HTTP/SQLite workload, not 24h/WAN evidence.
      - name: Upload R14l packaged HTTP soak metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GameRoom-R14l-Packaged-HTTP-Soak
          path: |
            ${{ runner.temp }}/game-room-r14l-packaged-load.json
            ${{ runner.temp }}/game-room-r14l-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: R14m verify real packaged spectator WebSocket fanout
        working-directory: server
        shell: pwsh
        run: |
          node --check ./smoke-packaged-websocket-fanout.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14m packaged WebSocket client syntax invalid" }
          node --check ./analyze-packaged-ws-fanout.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14m analyzer syntax invalid" }
          node ./analyze-packaged-ws-fanout.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14m strict contract self-test failed" }
          $ws = Join-Path $env:RUNNER_TEMP "game-room-r14m-packaged-ws.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14m-summary.json"
          node ./analyze-packaged-ws-fanout.mjs "--input=$ws" "--summary=$summary"
          if ($LASTEXITCODE -ne 0) { throw "R14m packaged WS fanout/replay evidence invalid" }
          Get-Content $summary

      # R14m is isolated packaged loopback WSS-free WebSocket evidence.
      - name: Upload R14m packaged WS fanout metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GameRoom-R14m-Packaged-WebSocket-Fanout
          path: |
            ${{ runner.temp }}/game-room-r14m-packaged-ws.json
            ${{ runner.temp }}/game-room-r14m-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: R14n verify packaged Windows listener-JVM duration trend
        working-directory: server
        shell: pwsh
        run: |
          node --check ./analyze-packaged-ws-duration.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14n analyzer syntax invalid" }
          node ./analyze-packaged-ws-duration.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14n mutation self-test failed" }
          $duration = Join-Path $env:RUNNER_TEMP "game-room-r14n-packaged-duration.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14n-summary.json"
          node ./analyze-packaged-ws-duration.mjs "--input=$duration" "--summary=$summary"
          if ($LASTEXITCODE -ne 0) { throw "R14n real packaged listener JVM duration measurements invalid" }
          Get-Content $summary

      # Bounded Windows loopback duration trend only, not a 24-hour field soak.
      - name: Upload R14n packaged JVM duration metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GameRoom-R14n-Packaged-JVM-Duration
          path: |
            ${{ runner.temp }}/game-room-r14n-packaged-duration.json
            ${{ runner.temp }}/game-room-r14n-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: R14o verify external field duration analyzer contract
        working-directory: server
        shell: pwsh
        run: |
          # Do NOT execute an overnight field observation on hosted CI.
          # check-powershell.ps1 separately parses the read-only field sampler.
          node --check ./analyze-packaged-jvm-field.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14o field analyzer syntax invalid" }
          node ./analyze-packaged-jvm-field.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14o 24h/partial trace analyzer self-test failed" }

      - name: R14p verify external multi-client WSS field analyzer contract
        working-directory: server
        shell: pwsh
        run: |
          # Real public HTTPS/WSS and test-member credentials are field-only.
          # Hosted CI validates parsers and incomplete/error-case fixtures.
          node --check ./observe-external-wss-field.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14p external field client syntax invalid" }
          node --check ./analyze-external-wss-field.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14p external field analyzer syntax invalid" }
          node ./analyze-external-wss-field.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14p external field data contract failed" }

      - name: R14q verify combined JVM and external WSS field correlation
        working-directory: server
        shell: pwsh
        run: |
          # Only synthetic 24h/negative fixtures. Never fetch operator
          # traces, public addresses, credentials or real field clients.
          node --check ./analyze-correlated-field-evidence.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14q correlation syntax invalid" }
          node ./analyze-correlated-field-evidence.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14q correlated field evidence self-test failed" }

      - name: R14r validate actual packaged Yacht and guest chat recovery
        working-directory: server
        shell: pwsh
        run: |
          node --check ./analyze-packaged-yacht-recovery.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14r report analyzer syntax invalid" }
          node ./analyze-packaged-yacht-recovery.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14r two-player Yacht analyzer mutation tests failed" }
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14r-packaged-yacht.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14r-summary.json"
          node ./analyze-packaged-yacht-recovery.mjs "--input=$report" "--summary=$summary"
          if ($LASTEXITCODE -ne 0) { throw "R14r actual packaged Yacht/game chat restart verification failed" }
          Get-Content $summary

      # Sanitized real packaged JVM two-player game recovery, no user tokens.
      - name: Upload R14r packaged Yacht recovery metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GameRoom-R14r-Packaged-Yacht-Recovery
          path: |
            ${{ runner.temp }}/game-room-r14r-packaged-yacht.json
            ${{ runner.temp }}/game-room-r14r-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: R14s verify actual packaged Yacht player WSS reconnect and multiple turns
        working-directory: server
        shell: pwsh
        run: |
          node --check ./smoke-packaged-yacht-player-ws.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14s real player worker syntax invalid" }
          node --check ./analyze-packaged-yacht-player-ws.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14s player analyzer syntax invalid" }
          node ./analyze-packaged-yacht-player-ws.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14s player WS/turn mutation contracts failed" }
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14s-yacht-player-ws.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14s-summary.json"
          node ./analyze-packaged-yacht-player-ws.mjs "--input=$report" "--summary=$summary"
          if ($LASTEXITCODE -ne 0) { throw "R14s actual two-player WSS and Yacht turn evidence invalid" }
          Get-Content $summary

      - name: Upload R14s packaged Yacht player WebSocket evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GameRoom-R14s-Packaged-Yacht-Player-WebSocket
          path: |
            ${{ runner.temp }}/game-room-r14s-yacht-player-ws.json
            ${{ runner.temp }}/game-room-r14s-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: R14t verify real packaged chat duplicates and Yacht command consistency
        working-directory: server
        shell: pwsh
        run: |
          node --check ./smoke-packaged-yacht-consistency.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14t fixture syntax invalid" }
          node --check ./analyze-packaged-yacht-consistency.mjs
          if ($LASTEXITCODE -ne 0) { throw "R14t analyzer syntax invalid" }
          node ./analyze-packaged-yacht-consistency.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "R14t duplicate/stale request negative tests failed" }
          $report = Join-Path $env:RUNNER_TEMP "game-room-r14t-consistency.json"
          $summary = Join-Path $env:RUNNER_TEMP "game-room-r14t-summary.json"
          node ./analyze-packaged-yacht-consistency.mjs "--input=$report" "--summary=$summary"
          if ($LASTEXITCODE -ne 0) { throw "R14t actual packaged consistency acceptance failed" }
          Get-Content $summary

      - name: Upload R14t packaged chat and Yacht consistency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GameRoom-R14t-Packaged-Consistency
          path: |
            ${{ runner.temp }}/game-room-r14t-consistency.json
            ${{ runner.temp }}/game-room-r14t-summary.json
          if-no-files-found: ignore
          retention-days: 14

      # Isolated fixture JVM observations only: never include credentials,
      # real room identifiers or production server process measurements.
      - name: Upload R14j soak metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GameRoom-R14j-Isolated-Soak-Metrics
          path: |
            ${{ runner.temp }}/game-room-r14j-soak.jsonl
            ${{ runner.temp }}/game-room-r14j-summary.json
          if-no-files-found: ignore
          retention-days: 14

      # Observations are scoped to disposable real Windows EXEs only.
      - name: Upload R14k packaged EXE metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GameRoom-R14k-Packaged-EXE-Metrics
          path: |
            ${{ runner.temp }}/game-room-r14k-packaged-exe.json
            ${{ runner.temp }}/game-room-r14k-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BroadcastingGamePlatformServer-Windows-x64-v0.1.0
          path: server/dist/BroadcastingGamePlatformServer/**
          if-no-files-found: error
          retention-days: 30
