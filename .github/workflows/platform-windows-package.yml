name: Broadcasting Game Platform Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main, "fix/participant-soop-channels"]
    paths:
      - "server/**"
      - "web/**"
      - "docs/**"
      - ".github/workflows/platform-windows-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Prepare browser physics assets
        shell: pwsh
        run: ./server/prepare-browser-physics.ps1

      - name: Check browser JavaScript
        shell: pwsh
        run: |
          node --check web/admin/assets/platform-admin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/viewer-draw-number.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/viewer-draw.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/viewer-draw-map-engine.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/viewer-draw-map-maker.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node web/admin/assets/viewer-draw-map-engine-probe.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/tools/viewer-draw/marble/browser-physics-adapter.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "web/vendor/box2d-wasm/entry.js")) { throw "box2d-wasm entry missing" }
          if (-not (Test-Path "web/vendor/box2d-wasm/Box2D.simd.wasm")) { throw "box2d-wasm SIMD wasm missing" }
          node --check web/tools/viewer-draw/marble/viewer-draw-marble.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node web/tools/viewer-draw/marble/browser-physics-adapter-probe.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/drawing-guess-canvas.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/drawing-guess-create.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/drawing-guess-room.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/games/drawing-guess/drawing-guess-overlay.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/tools/viewer-draw/viewer-draw-overlay.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/board-room-admin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/board-room-operation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/games/board/js/throw-presentation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/games/board/js/board.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/games/board/js/board-rect.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke box2d-wasm in browser
        shell: pwsh
        run: |
          $server = Start-Process -FilePath "python" -ArgumentList @(
            "-m", "http.server", "8123",
            "--bind", "127.0.0.1",
            "--directory", "web"
          ) -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2

            $candidates = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
            )
            $browser = $candidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

            if (-not $browser) {
              throw "Chrome/Edge headless browser not found"
            }

            $arguments = @(
              "--headless",
              "--disable-gpu",
              "--no-sandbox",
              "--virtual-time-budget=10000",
              "--dump-dom",
              "http://127.0.0.1:8123/tools/viewer-draw/marble/box2d-wasm-browser-probe.html"
            )
            $dom = & $browser @arguments 2>&1 | Out-String

            if ($LASTEXITCODE -ne 0) {
              throw "headless browser probe failed: $dom"
            }
            if ($dom -notmatch 'data-status="pass"') {
              throw "box2d-wasm browser probe did not pass: $dom"
            }
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Build platform server
        working-directory: server
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Run platform regression probes
        working-directory: server
        shell: pwsh
        run: |
          $jar = "target/broadcasting-game-platform-server-0.1.0-SNAPSHOT.jar"

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.platform.events.PlatformEventBusProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.tools.viewerdraw.ViewerDrawProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.tools.viewerdraw.ViewerDrawMapProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.games.drawingguess.DrawingSyncProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.games.drawingguess.DrawingGuessCoreProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.games.drawingguess.DrawingGuessPersistenceProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.games.drawingguess.DrawingGuessChatProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.games.drawingguess.DrawingGuessOverlayStateProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.games.drawingguess.DrawingGuessRecoveryProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.room.RoomProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.room.BoardGameRuntimeProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.room.MixedMovementProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.room.RoomOperationProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.boardserver.PlatformServerMain --board-server-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.boardserver.ClientBoundaryProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.boardserver.ServerManagementProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.boardserver.AdminAuthPersistenceProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.boardserver.BoardServerConfigPersistenceProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows app
        working-directory: server
        shell: pwsh
        run: ./package-windows.ps1 -Version 0.1.0 -SkipBuild

      - name: Verify package
        working-directory: server
        shell: pwsh
        run: |
          $root = Resolve-Path "dist/BroadcastingGamePlatformServer"
          $exe = Join-Path $root "BroadcastingGamePlatformServer.exe"

          if (-not (Test-Path $exe)) { throw "platform executable missing" }
          if (Test-Path (Join-Path $root "config.json")) { throw "live config.json must not be shipped" }
          if (-not (Test-Path (Join-Path $root "config.example.json"))) { throw "config.example.json missing" }
          if (-not (Test-Path (Join-Path $root "runtime/bin/server/jvm.dll"))) { throw "bundled runtime missing" }
          if (-not (Test-Path (Join-Path $root "THIRD_PARTY_NOTICES.md"))) { throw "third-party notices missing" }
          if (-not (Test-Path (Join-Path $root "web/vendor/box2d-wasm/entry.js"))) { throw "packaged box2d-wasm entry missing" }
          if (-not (Test-Path (Join-Path $root "web/vendor/box2d-wasm/Box2D.simd.wasm"))) { throw "packaged box2d-wasm SIMD wasm missing" }

          @(
            "web/index.html",
            "web/assets/platform.css",
            "web/admin/index.html",
            "web/admin/assets/platform-admin.js",
            "web/admin/assets/viewer-draw.css",
            "web/admin/assets/viewer-draw-number.js",
            "web/admin/assets/viewer-draw.js",
            "web/admin/assets/viewer-draw-map-engine.js",
            "web/admin/assets/viewer-draw-map-maker.js",
            "web/admin/assets/viewer-draw-map-maker.css",
            "web/admin/tools/viewer-draw/index.html",
            "web/admin/tools/viewer-draw/map-maker/index.html",
            "web/tools/viewer-draw/marble/index.html",
            "web/tools/viewer-draw/marble/browser-physics-adapter.js",
            "web/tools/viewer-draw/marble/viewer-draw-marble.js",
            "web/tools/viewer-draw/marble/viewer-draw-marble.css",
            "web/admin/games/drawing-guess/index.html",
            "web/admin/games/drawing-guess/room.html",
            "web/admin/assets/drawing-guess.css",
            "web/admin/assets/drawing-guess-canvas.js",
            "web/admin/assets/drawing-guess-create.js",
            "web/admin/assets/drawing-guess-room.js",
            "web/games/drawing-guess/index.html",
            "web/games/drawing-guess/drawing-guess-overlay.css",
            "web/games/drawing-guess/drawing-guess-overlay.js",
            "web/tools/viewer-draw/index.html",
            "web/tools/viewer-draw/viewer-draw-overlay.js",
            "web/admin/games/board/index.html",
            "web/admin/games/board/room.html",
            "web/admin/assets/board-room-admin.js",
            "web/admin/assets/board-room-operation.js",
            "web/server-management.html",
            "web/games/board/index.html",
            "web/games/board/rect.html",
            "web/games/board/js/board.js",
            "web/games/board/js/board-rect.js"
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $root $_))) {
              throw "required platform asset missing: $_"
            }
          }

          Get-ChildItem (Join-Path $root "web") -Recurse -File | ForEach-Object {
            $text = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
            if ($text -match "먀로또|roulette-ui|roulette-core|ticket-renderer") {
              throw "roulette/lotto artifact must not exist: $($_.FullName)"
            }
          }

          $landing = Get-Content (Join-Path $root "web/index.html") -Raw
          if ($landing -notmatch "보드게임") { throw "board game missing from platform landing" }
          if ($landing -match "먀로또|로또") { throw "lotto must not appear on platform landing" }

          $probe = Start-Process -FilePath $exe -ArgumentList "--board-server-probe" -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            throw "packaged platform server probe failed: $($probe.ExitCode)"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BroadcastingGamePlatformServer-Windows-x64-v0.1.0
          path: server/dist/BroadcastingGamePlatformServer/**
          if-no-files-found: error
          retention-days: 30
