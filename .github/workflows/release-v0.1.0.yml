name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.1.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check browser JavaScript
        shell: pwsh
        run: |
          node --check web/admin/assets/platform-admin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/board-room-admin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/admin/assets/board-room-operation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/games/board/js/throw-presentation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/games/board/js/board.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/games/board/js/board-rect.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build platform server
        working-directory: server
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Run release regression probes
        working-directory: server
        shell: pwsh
        run: |
          $jar = "target/broadcasting-game-platform-server-0.1.0-SNAPSHOT.jar"

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.platform.events.PlatformEventBusProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.room.RoomProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.room.BoardGameRuntimeProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.room.MixedMovementProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.room.RoomOperationProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.boardserver.PlatformServerMain --board-server-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.boardserver.ClientBoundaryProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.boardserver.ServerManagementProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.boardserver.AdminAuthPersistenceProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          java -cp $jar io.github.playcosmos.broadcastinggameplatform.boardserver.BoardServerConfigPersistenceProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 app
        working-directory: server
        shell: pwsh
        run: ./package-windows.ps1 -Version 0.1.0 -SkipBuild

      - name: Verify packaged app
        working-directory: server
        shell: pwsh
        run: |
          $root = Resolve-Path "dist/BroadcastingGamePlatformServer"
          $exe = Join-Path $root "BroadcastingGamePlatformServer.exe"

          if (-not (Test-Path $exe)) { throw "platform executable missing" }
          if (Test-Path (Join-Path $root "config.json")) { throw "live config.json must not be shipped" }
          if (-not (Test-Path (Join-Path $root "config.example.json"))) { throw "config.example.json missing" }
          if (-not (Test-Path (Join-Path $root "runtime/bin/server/jvm.dll"))) { throw "bundled runtime missing" }

          $probe = Start-Process -FilePath $exe -ArgumentList "--board-server-probe" -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            throw "packaged platform server probe failed: $($probe.ExitCode)"
          }

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          $zip = "BroadcastingGamePlatformServer-Windows-x64-v0.1.0.zip"
          Compress-Archive -Path "server/dist/BroadcastingGamePlatformServer" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  $zip" -Encoding ascii
          Write-Host "SHA256 $hash"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 `
            "BroadcastingGamePlatformServer-Windows-x64-v0.1.0.zip" `
            "BroadcastingGamePlatformServer-Windows-x64-v0.1.0.zip.sha256" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Broadcasting Game Platform v0.1.0" `
            --notes-file "docs/releases/v0.1.0.md"
