name: One-time TTS prerelease cleanup
on:
  push:
    branches:
      - fix/adversarial-review-p1-20261011
    paths:
      - .github/workflows/tts-prerelease-cleanup-once.yml

permissions:
  contents: write

jobs:
  remove-tts-prereleases:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preflight all three TTS release identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for tag in v0.1.1-alpha.5 v0.1.1-alpha.6 v0.1.1-alpha.7; do
            name="$(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq '.name')"
            if [[ "${name}" != *TTS* ]]; then
              echo "::error::Refusing deletion: release ${tag} is not TTS-specific."
              exit 1
            fi
            echo "Confirmed TTS prerelease: ${tag}"
          done

      - name: Delete only confirmed TTS releases and matching tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for tag in v0.1.1-alpha.5 v0.1.1-alpha.6 v0.1.1-alpha.7; do
            gh release delete "${tag}" --repo "${GH_REPO}" --yes --cleanup-tag
            echo "Deleted release and tag: ${tag}"
          done

      - name: Verify release and Git-tag removal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for tag in v0.1.1-alpha.5 v0.1.1-alpha.6 v0.1.1-alpha.7; do
            if gh api "repos/${GH_REPO}/releases/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::Release still exists: ${tag}"
              exit 1
            fi
            if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::Git tag still exists: ${tag}"
              exit 1
            fi
          done
          echo "All three TTS releases and Git tags are absent."
