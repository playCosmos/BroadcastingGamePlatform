name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "number.html"
      - "marble.html"
      - "map-maker.html"
      - "web/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Box2D browser assets
        shell: bash
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          mkdir -p vendor/box2d-wasm
          cp node_modules/box2d-wasm/dist/es/entry.js vendor/box2d-wasm/
          cp node_modules/box2d-wasm/dist/es/Box2D.js vendor/box2d-wasm/
          cp node_modules/box2d-wasm/dist/es/Box2D.wasm vendor/box2d-wasm/
          cp node_modules/box2d-wasm/dist/es/Box2D.simd.js vendor/box2d-wasm/
          cp node_modules/box2d-wasm/dist/es/Box2D.simd.wasm vendor/box2d-wasm/
          rm -rf node_modules

      - name: Build static Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/web

          cp index.html _site/index.html
          cp number.html _site/number.html
          cp marble.html _site/marble.html
          cp map-maker.html _site/map-maker.html

          cp -R web/assets _site/web/assets
          mkdir -p _site/web/admin
          cp -R web/admin/assets _site/web/admin/assets
          cp -R web/tools _site/web/tools
          cp -R web/vendor _site/web/vendor

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
